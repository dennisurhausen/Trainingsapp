<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Trainingsplan Wo 1–14</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout: gym-logger look — near-black surfaces, one fire-orange accent, big numbers; one 550.5px column, sticky week header + apparatus bar, tab bar at the thumb. Dark-first. */
:root{
  --bg:#25282b; --head:#1c1f22; --surface:#2f3336; --surface2:#363a3e; --sunk:#41464b; --ink:#eceff1; --muted:#9aa1a8; --line:#3b4045;
  --accent:#12a4e6; --accent2:#0b8cc6; --accent-ink:#ffffff; --soft:#1e3a4a; --fire:#12a4e6;
  --try:#f0a63a; --try-soft:#3d3222; --ok:#3ccf7e; --ok-soft:#21392c; --warn:#f2c14e; --warn-soft:#3d3522; --bad:#ff6b6b; --bad-soft:#442a2c;
  --d-boden:#2bbd88; --d-sprung:#e0a21a; --d-reck:#5aa0f0; --d-pferd:#e0709a; --d-hand:#3fb83f; --d-barren:#a497ef; --d-ringe:#ef7b7b; --d-warm:#8592a2; --d-kond:#9aa6b4;
  --f-display:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8.5px; --tabh:55px; --toph:103px;
  color-scheme:dark;
}


:root[data-theme="light"]{
  --bg:#eef0f2; --head:#ffffff; --surface:#ffffff; --surface2:#f4f5f7; --sunk:#e3e6ea; --ink:#1d2023; --muted:#5f666d; --line:#dde1e5;
  --accent:#0a8fd0; --accent2:#0878b0; --accent-ink:#ffffff; --soft:#e2f2fb; --fire:#0a8fd0;
  --try:#a8660a; --try-soft:#fdf0dc; --ok:#15924d; --ok-soft:#e1f4e9; --warn:#946600; --warn-soft:#fbf0d2; --bad:#c83434; --bad-soft:#fbe3e3;
  --d-boden:#1baf7a; --d-sprung:#c98500; --d-reck:#2a78d6; --d-pferd:#d55181; --d-hand:#008300; --d-barren:#6250d6; --d-ringe:#e34948; --d-warm:#7d8999; --d-kond:#66727f;
  color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wrap{max-width:550.5px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:8.5px 7.5px;display:flex;flex-direction:column;gap:7.5px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:3.5px 10.5px;flex-wrap:wrap}
.wk{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1;text-transform:uppercase;letter-spacing:.06em}
.wk small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:7px;white-space:nowrap;text-transform:none;letter-spacing:0}
.phase{font-family:var(--f-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);white-space:nowrap}
.days{display:grid;grid-template-columns:20.5px repeat(7,1fr) 20.5px;gap:4.5px;align-items:stretch}
.days .arrow{border:0;background:none;color:var(--muted);font-size:20.5px;padding:0}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10.5px;padding:4.5px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day b{font-family:var(--f-display);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day span{font-family:var(--f-display);font-size:15.5px;font-weight:400;line-height:1}
.day i{font-style:normal;font-size:8.5px;letter-spacing:.06em;color:var(--muted);height:10.5px;font-family:var(--f-display);font-weight:600}
.day .dd{display:flex;gap:2px;height:4.5px}
.day .dd em{width:4.5px;height:4.5px;border-radius:50%}
.day.today{border-color:var(--accent)}
.day.today span{color:var(--accent)}
.day.sel{background:var(--fire);border-color:transparent;color:var(--accent-ink)}
.day.sel b,.day.sel i,.day.sel span{color:var(--accent-ink)}
.day.sel .dd em{box-shadow:0 0 0 1px var(--accent-ink)}
.day.free span{opacity:.45}

main{padding-block:14px calc(var(--tabh) + 82.5px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:10.5px}
h2{font-family:var(--f-display);font-weight:400;font-size:20.5px;margin:0;line-height:1.15;text-wrap:balance;text-transform:uppercase;letter-spacing:.05em}
.center-h{text-align:center}
h3{font-family:var(--f-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10.5px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:10.5px;padding:8.5px 10.5px;font-size:12px}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.ok{background:var(--ok-soft);border-color:transparent}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾";color:var(--muted)}
details[open]>summary::after{content:" ▴"}
details.rule{font-size:11px;color:var(--muted)}
details.rule>summary{font-weight:600;color:var(--muted)}
details.rule p{margin-top:3.5px}

.units{display:flex;gap:5px;overflow-x:auto;padding:2.5px;background:var(--surface);border:1px solid var(--line);border-radius:859px}
.unit{flex:1 0 auto;border:0;background:transparent;border-radius:859px;padding:8.5px 12px;font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.unit.on{background:var(--fire);color:var(--accent-ink)}
.unit .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}

.sessionhead{display:flex;flex-direction:column;gap:8.5px}
.sessionhead h2{font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:3.5px 12px;font-size:12px;color:var(--muted)}
.meta strong{color:var(--ink);font-family:var(--f-display);font-size:15.5px;font-weight:700}
.progress{height:5px;border-radius:2.5px;background:var(--sunk);overflow:hidden}
.progress>div{height:100%;background:var(--fire);border-radius:2.5px;transition:width .25s}
.btn{border:0;background:var(--surface2);color:var(--accent);border-radius:859px;padding:8.5px 14px;font-weight:500;font-size:13px;letter-spacing:.03em}
.btn.primary{background:var(--fire);color:var(--accent-ink);border-color:transparent}
.btn.big{padding:13px 15.5px;font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;flex:1}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 9.5px;font-size:12px;border-radius:8.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:var(--surface2);color:var(--accent);border-radius:859px;width:44.5px;font-size:19px;font-weight:700;line-height:1;flex:none}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8.5px}
.panel{border-top:1px solid var(--line);padding-top:10.5px;display:flex;flex-direction:column;gap:8.5px}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10.5px;overflow:hidden}
.menu button{border:0;border-bottom:1px solid var(--line);background:var(--surface2);text-align:left;padding:10.5px 12px;font-weight:700}
.menu button:last-child{border-bottom:0}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:11px}

.compo{display:flex;gap:2px;height:7px;border-radius:3.5px;overflow:hidden}
.compo span{display:block;height:100%;min-width:2.5px}
.devnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph));z-index:15;background:var(--bg);padding-block:7px;margin-block:-4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.devnav::-webkit-scrollbar{display:none}
.dchip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10.5px;padding:6px 9.5px 6px 6px;text-align:left;position:relative;overflow:hidden}
.dchip .ic{width:26px;height:26px;border-radius:7.5px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc) 22%,transparent);color:var(--dc);flex:none}
.dchip .ic svg{width:16.5px;height:16.5px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dchip .tx{display:flex;flex-direction:column;line-height:1.1}
.dchip .tx b{font-family:var(--f-display);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.dchip .tx small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dchip .pb{position:absolute;left:0;bottom:0;height:2.5px;background:var(--dc)}
.dchip.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,var(--surface))}
.dchip.all{--dc:var(--accent)}
.dchip.all .ic{background:var(--sunk);color:var(--ink)}
.dchip.fin .tx small{color:var(--ok);font-weight:700}
.dhead{display:flex;align-items:center;gap:10.5px;margin-top:10.5px;padding:3.5px 2px}
.dhead .ic{width:31px;height:31px;border-radius:8.5px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc) 22%,transparent);color:var(--dc);flex:none}
.dhead .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dhead .t{flex:1;min-width:0}
.dhead .t b{font-family:var(--f-display);font-size:17px;font-weight:400;letter-spacing:.06em;line-height:1;display:block;text-transform:uppercase;letter-spacing:.02em}
.dhead .t small{font-size:11px;color:var(--muted)}
.dhead .r{text-align:right;font-family:var(--f-display);font-size:12px;color:var(--muted);line-height:1.15}
.dhead .r b{font-size:19px;color:var(--ink)}
.subsec{font-family:var(--f-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:2px 0 -4px 3.5px}
.devpager{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:5px}
.devpager .btn{display:flex;align-items:center;gap:7px;justify-content:center}
.devpager .btn i{width:8.5px;height:8.5px;border-radius:50%;background:var(--dc);display:inline-block}

/* exercise card */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10.5px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:0 2.5px 2.5px 0;background:var(--dc,var(--line))}
.item.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item.compact{flex-direction:row;align-items:center;padding:10px 12px 10px 14px;gap:10.5px;text-align:left;width:100%;justify-content:flex-start;background:var(--surface);border-color:transparent}
.item.compact::before{top:10.5px;bottom:10.5px}
.item.compact .ck{width:20.5px;height:20.5px;border-radius:50%;border:2px solid var(--sunk);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;color:#1c1f22}
.item.compact .ck.fin{background:var(--ok);border-color:var(--ok)}
.item.compact .ck.next{border-color:var(--accent)}
.item.compact .nm{flex:1;min-width:0;color:var(--accent);font-weight:400;font-size:15px;line-height:1.25;text-align:left}
.item.compact .nm small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.item.compact .nm small b{color:var(--accent);font-weight:500}
.item.compact .vl{display:flex;align-items:baseline;gap:2px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end;max-width:79px}
.item.compact .vl b{font-size:18px;font-weight:400;color:var(--ink)}
.item.compact .vl b.ok{color:var(--ok)}
.item.compact .vl b.over{color:var(--accent)}
.item.compact .vl span{font-size:13px;color:var(--muted)}
.item.compact .vl small{flex-basis:100%;text-align:right;font-size:9.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:14px;flex:none;padding-left:3.5px}
.item.open{border-color:var(--line)}
.item.open .ihead{cursor:pointer}
.item.open .iname{color:var(--accent);font-weight:400;font-size:16.5px}
.ihead{display:flex;gap:10.5px;align-items:flex-start}
.ihead .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3.5px}
.iname{font-weight:500;font-size:14.5px;line-height:1.25}
.isub{font-size:11px;color:var(--muted)}
.itags{display:flex;flex-wrap:wrap;gap:4.5px;align-items:center}
.tag{font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:859px;background:var(--sunk);color:var(--muted)}
.tag.try{background:var(--try-soft);color:var(--try)}
.tag.S{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.U{background:var(--sunk);color:var(--ink)}
.tag.K{background:var(--sunk);color:var(--ink)}
.tag.ovr{background:var(--warn-soft);color:var(--warn)}
.tag.now{background:var(--fire);color:var(--accent-ink)}
.tag.extra{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.goal{text-align:right;flex:none}
.goal .n{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:.95;color:var(--ink)}
.goal .u{font-size:10.5px;color:var(--muted)}
.more{border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;padding:2px 0;text-align:left;align-self:flex-start}

/* unified counter: − value + */
.stepper{display:grid;grid-template-columns:48px 1fr 62px;gap:8.5px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:5px}
.stepper .minus{height:44.5px;border-radius:10.5px;border:0;background:var(--sunk);font-size:22.5px;font-weight:700;color:var(--muted)}
.stepper .plus{height:51.5px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;font-weight:500;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 15.5px -8px var(--accent)}
.stepper .plus small{font-family:var(--f-body);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.stepper .val{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.stepper .val b{font-family:var(--f-display);font-size:31px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--accent)}
.stepper .val b small{font-size:17px;color:var(--muted);font-weight:600}
.stepper .val span{font-size:10.5px;color:var(--muted);margin-top:2.5px}
.stepper .val .xtra{font-style:normal;color:var(--accent);font-weight:500}
th.n{font-size:9.5px;font-family:var(--f-body)}
td:first-child{white-space:nowrap}
.stepper.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.stepper.done .val b{color:var(--ok)}
.stepper.over .val b{color:var(--accent)}
.mbar{height:3.5px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.mbar>div{height:100%;background:var(--fire)}
.mbar.done>div{background:var(--ok)}
.attempts{display:grid;grid-template-columns:1fr 1fr 44.5px;gap:7px}
.abtn{height:48px;border-radius:859px;border:0;font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px}
.abtn.yes{background:var(--fire);color:var(--accent-ink);box-shadow:0 5px 15.5px -8px var(--accent)}
.abtn.no{background:var(--sunk);color:var(--ink)}
.abtn.undo{background:var(--surface2);border:1px solid var(--line);font-size:17px;color:var(--muted)}
.seq{display:flex;flex-wrap:wrap;gap:4.5px;align-items:center;min-height:19px}
.seq span,.seq button{width:22.5px;height:22.5px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:0;padding:0}
.seq .q{background:var(--warn-soft);color:var(--warn)}
.seq .y{background:var(--ok);color:#1c1f22}
.seq .x{background:var(--bad-soft);color:var(--bad)}
.seq .e{border:1.5px dashed var(--line)}
.ladder{display:flex;flex-direction:column;gap:3.5px;font-size:12px}
.ladder div{display:flex;align-items:center;gap:8.5px;color:var(--muted)}
.ladder div .ck{width:19px;height:19px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
.ladder div.on{color:var(--ink)}
.ladder div.on .ck{background:var(--ok);border:0;color:#1c1f22}
.ladder div.next{color:var(--ink);font-weight:700}
.ladder div.next .ck{border-color:var(--accent);color:var(--accent)}
.seg.pills{border:0;background:transparent;gap:8.5px}
.seg.pills button{border-radius:859px;background:var(--surface);padding:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.seg.pills button+button{border-left:0}
.seg.pills button.on{background:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8.5px;overflow:hidden;flex-wrap:nowrap;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 9.5px;font-weight:700;font-size:12px;min-width:31px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fire);color:var(--accent-ink)}
.seg.full{display:flex}
.seg.full button{flex:1}
.lbl{font-size:11px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:3.5px}
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--surface2);border:1px solid var(--line);border-radius:8.5px;padding:8.5px;width:100%;min-width:0}
select{width:auto;padding:7px 8.5px;font-weight:700;font-size:12px}
textarea{resize:vertical;min-height:60px}
.stages{display:flex;flex-direction:column;gap:7px}
.stage{display:grid;grid-template-columns:1fr auto;gap:3.5px 8.5px;align-items:center;padding-top:7px;border-top:1px solid var(--line)}
.stage:first-child{border-top:0;padding-top:0}
.stage .d{font-size:12px;color:var(--muted);grid-column:1}
.formq{display:grid;grid-template-columns:65.5px 1fr;gap:7px;align-items:center}
.intro{display:flex;flex-direction:column;gap:7px;border-color:var(--accent)}
.intro ol{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:3.5px;font-size:13px}

/* gym set table */
.sets{display:flex;flex-direction:column;gap:5px}
.sethead,.set{display:grid;grid-template-columns:17px 43px 1.35fr 1fr 1fr 39.5px;gap:4.5px;align-items:center}
.sethead{font-family:var(--f-display);font-size:9.5px;color:var(--muted);font-weight:500;text-align:center;text-transform:uppercase;letter-spacing:.12em}

che 13: 11.01. – 17.01.2027 · Normale Woche, die Pause war die Entlastung. Do (C) bei RIR 3, weil abends Reck/Barren (Praxis).","W14":"Woche 14: 18.01. – 24.01.2027 · Wettkampfwoche (So 24.01., Annahme). Do und Fr kein Gym. Volumen runter, Intensität halten (Lit.: Bosquet et al. 2007)."},"turnLog":[{"date":"2026-10-19","abend":"Mo","element":"Strecksalto vw 1/1 Drehung (Lehrweg)","hilfe":null,"versuche":6,"gelungen":null,"note":null,"notiz":"Mit anderen trainiert, mehr als geplant. gelungen/Hilfe/Note bitte nachtragen."},{"date":"2026-10-19","abend":"Mo","element":"Überkehren (Flugteil; Weichboden, Partner)","hilfe":null,"versuche":4,"gelungen":null,"note":null,"notiz":"gelungen/Hilfe/Note bitte nachtragen."},{"date":"2026-10-19","abend":"Mo","element":"Kippe in Handstand (Matte, Partner)","hilfe":null,"versuche":4,"gelungen":null,"note":null,"notiz":"gelungen/Hilfe/Note bitte nachtragen."}],"turnLogInfo":["Eine Zeile pro Element und Abend. Element und Hilfe aus der Liste wählen. „gelungen“ vorher festlegen, z. B. auf den Füßen, ohne Sturz, Griff gefasst.","Beispiel: 19.10.26 · Mo · Überkehren · Weichboden · 8 Versuche · 3 gelungen · Note 2 · „zu früh gelöst“"],"hilfeOptions":["Partner","Weichboden","Trampolin","Doppelmini","Matte","ohne"],"status":[{"row":6,"device":"Reck","element":"Kippe in Handstand (Matte, Partner)","lernstufe":"A"},{"row":7,"device":"Reck","element":"Überkehren (Flugteil; Weichboden, Partner)","lernstufe":"A"},{"row":8,"device":"Reck","element":"Salto-Abgang in Sicherung","lernstufe":"A"},{"row":9,"device":"Reck","element":"Riesenfelgen Drehungen rw","lernstufe":"A"},{"row":10,"device":"Reck","element":"Freie Felge","lernstufe":"A"},{"row":11,"device":"Boden","element":"Strecksalto vw 1/1 Drehung (Lehrweg)","lernstufe":"A"},{"row":12,"device":"Boden","element":"Spagat zu Schweizer (Übergang)","lernstufe":"A"},{"row":13,"device":"Barren","element":"Übergrätschen mit Fangen","lernstufe":"A"},{"row":14,"device":"Barren","element":"Unterschwung in Verbindung mit Übergrätschen (mit und ohne Fangen)","lernstufe":"A"},{"row":15,"device":"Pferd","element":"Wanderflanke, saubere","lernstufe":"A"},{"row":16,"device":"Handstand","element":"Japaner-Versuche","lernstufe":"A"},{"row":17,"device":"Ringe","element":"Handstand (Ringe)","lernstufe":"A"},{"row":18,"device":"Ringe","element":"Kreuzhang mit Gummiband (je 3 s)","lernstufe":"A"}],"statusNotes":["Lernstufe selbst eintragen: A = neu, nur mit Hilfe · B = klappt manchmal alleine · C = fast sicher, in Verbindung. Ampel = Praxis-Heuristik.","Ampel grün = in ≥ 3 Einheiten der letzten 14 Tage ≥ 80 % ohne Hilfe gelungen. Praxis-Heuristik, keine Studie.","Kür-Entscheid bis So 13.12.: Was dann nicht mindestens gelb/B ist, wird im Wettkampf durch ein bekanntes Element ersetzt und bleibt im Training.","Rollen wechseln: Ende Wo 4 und Wo 8 im Blatt Umfänge (Spalten Rolle P2/P3). Die Mengen in den Turn-Blättern passen sich automatisch an."],"rules":[{"nr":1,"text":"Turnen geht vor. Leidet das Turnen (müde Arme, Muskelkater am Turnabend), wird das Gym gekürzt, nie das Turnen.","src":"deine Vorgabe"},{"nr":2,"text":"Last erst steigern, wenn du die obere Wdh-Zahl im RIR-Bereich in allen Sätzen schaffst. Mit dem neuen Gewicht wieder unten im Bereich starten (doppelte Progression).","src":"Sarahs FAQ"},{"nr":3,"text":"Hauptübungen: schwerer Satz mit Ziel-RIR. Passt die Ziel-kg nicht zum RIR, gilt der RIR: Last anpassen, nicht den RIR.","src":"Sarahs FAQ"},{"nr":4,"text":"Zeitnot: 1. Aufwärmen straffen, 2. Pausen kürzen, 3. Kabel-Fliegende weg, 4. je 1 Satz Arme weg. Hauptübungen bleiben. Lieber Sätze halbieren als Übungen streichen.","src":"Sarahs FAQ, Gymnastics BC"},{"nr":5,"text":"Gym-Einheit > 120 min (inkl. Umziehen) in Woche 1 gemessen → Kabel-Fliegende dauerhaft raus.","src":"deine Vorgabe 2 h"},{"nr":6,"text":"Schmerz: gering und stabil oder abnehmend ist ok. Steigt er, zuerst Dips und Schulterdrücken reduzieren (Last, dann Tiefe/Sätze). Hält er an: Physio/Arzt.","src":"Sarahs FAQ"},{"nr":7,"text":"Schlechte Tagesform: Einheit auf den nächsten möglichen Tag schieben – aber nie direkt vor ein Turnen. Ist die Einheit leicht, nur die Hauptübungen machen.","src":"Sarahs FAQ"},{"nr":8,"text":"Zwei schlechte Einheiten in Folge: Schlaf, Essen, Stress prüfen und die nächste Woche wie eine Entlastungswoche fahren.","src":"Sarahs FAQ, ohne Coach"},{"nr":9,"text":"Verpasste Einheit: Hauptübungen der verpassten Einheit in die nächste Einheit nehmen, Assistenz weglassen. Mehr als eine verpasst: Woche wiederholen.","src":"Sarahs FAQ"},{"nr":10,"text":"Turnen, Versuche: nur mit Sicherung. Abbruch nach 2 Fehlversuchen in Folge oder bei Technikverlust. Zahl in der Tabelle = Obergrenze.","src":"Übergabe"},{"nr":11,"text":"Boden: immer vw vor rw, Schraube vw (Strecksalto 1/1) in jeder Boden-Einheit. Reck: 1–2 Runden Riesen, dann Technik (Überkehren, Salto, Drehungen). Barren: 2 Runden 3 × 3 Stützschwünge in den Handstand, dann Elemente; Kippen nur am Do (Handflächen).","src":"deine Vorgaben"},{"nr":12,"text":"Reihenfolge im Gerätblock: leicht → schwer und thematisch (z. B. Kippe → Kippe in den Handstand, Riesen → Umspringen → Drehungen → Überkehren). Vor einem neuen Element 2–3 Wiederholungen der einfacheren Vorstufe, dann das neue Element, solange du frisch bist. Vorstufen kurz halten. Schwerpunkt-Elemente (S/★) gebündelt üben. U-Elemente: wenige saubere Versuche, damit nichts verloren geht. K: konstant (Salto-Abgang = Kopfsache: regelmäßig, Sicherung schrittweise abbauen; Ringe-Kraft).","src":"Lit. (Porter & Magill 2010; Branscheidt et al. 2019) + Praxis"},{"nr":13,"text":"Check zu Beginn: die ersten 2 Versuche jedes Schwerpunkt-Elements mit Note 1–5 ins Turn-Log. Sie zeigen, was seit dem letzten Mal hängen geblieben ist (die besten Versuche am Ende überschätzen den Lernstand).","src":"Lit. (Brady 2004) + Ableitung"},{"nr":14,"text":"Rollen prüfen Ende Wo 4 und Wo 8 im Blatt Status: Schwerpunkt-Element grün → auf –, nächstes U-Element auf S (Blatt Umfänge, Spalten Rolle P2/P3).","src":"Praxis"},{"nr":15,"text":"Partner da → Partner-Elemente vorziehen. Mehr oder weniger gemacht als geplant ist ok: ins Turn-Log eintragen, was du wirklich gemacht hast.","src":"Praxis"},{"nr":16,"text":"Tausch Turnen ↔ Gym (z. B. wenn Partner an einem anderen Tag da sind): Turnplan des Tages mitnehmen. Liegen dadurch zwei Turnabende direkt hintereinander, am zweiten den Barren weglassen, falls er am ersten dran war, und Gym C nur leicht (RIR 3). Schwimmen bleibt ≥ 6 h vom Gym weg.","src":"Praxis"},{"nr":17,"text":"Pferd: immer zuerst Kreisflanken, dann die Wanderflanke (technisch am schwersten, frisch), dann der Rest. Pilz vorerst raus. Mo Kreisflanken + Wanderflanke, Di volles Programm mit Wanderflanke zuerst, Do Kreisflanken + Scheren-Serien/Abgang kurz.","src":"deine Vorgabe"},{"nr":18,"text":"Turnabend > 180 min: zuerst Kondition/Beweglichkeit nach Hause verlegen, dann Wiederholungen bekannter Elemente kürzen. Versuche und Durchgänge bleiben.","src":"Praxis"},{"nr":19,"text":"Calc pflegen: in Wo 1 die getesteten Übungen eintragen, nach Wo 5 und Wo 9 je einen harten Satz pro Übung. Dann rechnen Gym LT und Gym Plan die neuen Ziel-kg.","src":"Sarahs Calc"}],"evidence":[{"nr":1,"text":"Hauptübungen 5–8 Wdh, RIR 1–3, Pause 3–4 min","src":"Lit.: Keßler 2020 (RPE 8–9, Pause > 2 min); Wahl & Ji 2022 (Maximalkraft 3–4 min)"},{"nr":2,"text":"≥ 5 Sätze pro Hauptübung/Woche reichen für Kraft; ≥ 10 Sätze/Muskel gelten für Hypertrophie","src":"Lit.: Keßler 2020; Gavanda & Isenmann 2021"},{"nr":3,"text":"≥ 6 h zwischen Schwimmen und Krafttraining","src":"Lit.: Robineau et al. 2016 (JSCR), Ausdauer vs. Kraft"},{"nr":4,"text":"Ausdauer stört Maximalkraft und Hypertrophie kaum, Schnellkraft nur in derselben Einheit","src":"Lit.: Schumann et al. 2022 (Sports Med), Metaanalyse"},{"nr":5,"text":"Ermüdung beim Üben verschlechtert das Lernen, auch am Folgetag","src":"Lit.: Branscheidt et al. 2019 (Laborstudie, Greifaufgabe, nicht Turnen)"},{"nr":6,"text":"Exzentrische Kraft wichtig für Halteelemente an den Ringen","src":"Lit.: Schärer et al. 2021 (Sports). Übertrag auf Kreuzhang = Ableitung"},{"nr":7,"text":"Taper 2 Wochen, Volumen −41–60 %, Intensität halten","src":"Lit.: Bosquet et al. 2007, Metaanalyse"},{"nr":8,"text":"Kraft bleibt mit 1 Einheit/Woche bei gleicher Intensität erhalten","src":"Lit.: Spiering et al. 2021"},{"nr":9,"text":"Eiweiß ca. 1,6 g/kg/Tag","src":"Lit.: Morton et al. 2018 (BJSM)"},{"nr":10,"text":"Männliche Turner haben oft zu wenig Energie und Kohlenhydrate","src":"Lit.: Kuhlman et al. 2024 (n = 14, College)"},{"nr":11,"text":"Ausgleich Drücken/Ziehen, Hüftstreckung, einbeinige Arbeit","src":"Gymnastics BC Manual 2020"},{"nr":12,"text":"Neue Elemente gebündelt, sichere Elemente gemischt üben; Vorteil des Mischens im Sport klein","src":"Lit.: Brady 2004; Czyż et al. 2024 (Metaanalysen); Porter & Magill 2010"},{"nr":13,"text":"Vorstellungstraining zusätzlich zum Training wirkt (d ≈ 0,43), ersetzt es aber nicht","src":"Lit.: Simonsmeier et al. 2021 (Metaanalyse)"},{"nr":14,"text":"Ampel „wettkampfreif“ (≥ 80 % ohne Hilfe, ≥ 3 Einheiten in 14 Tagen)","src":"Praxis-Heuristik, keine Studie"},{"nr":15,"text":"Abstände Gym ↔ Turnen in Stunden, welche Übung an welchem Tag, Entlastung Wo 6, Ziel-% aus RIR","src":"Praxis / Planungslogik – keine Studie"}],"pause":{"intro":["Trainingsfreie Zeit 22.12.2026 – 08.01.2027 und Wiedereinstieg","Deine Vorgabe: frei, nur eine kurze Gym-Erhalt-Einheit am Mi 06.01. Die Halle ist ohnehin bis 10.01. zu."],"rows":[["Wo 9 (14.–20.12.)","Mi · Do · Fr","Mo · Di · Do","Attack (schwerste Woche)","Mi","Die Pause danach dient als Erholung."],["Wo 10","Mo 21.12.","letzter Abend","—","—","Kür (Entscheid bis 13.12.) letztmals bestätigen. Nur Sicheres geht in den Wettkampf."],["22.12. – 05.01.","alle Tage","frei","frei","frei","Trainingsfrei."],["Wo 12","Mi 06.01.","—","Erhalt · 10:00 · ca. 60 min","—","Nur Hauptübungen (RIR 2) + Rudern + Face Pull. Hält die Kraft (Lit.: Spiering et al. 2021)."],["07. – 08.01.","Do/Fr","frei","frei","frei",null],["Sa/So 09./10.01.",null,"frei","frei","frei","Wochenende wie immer frei."],["Wo 13 (11.–17.01.)","Mo 11.01.","Turnen Mo",null,null,"Wiedereinstieg. Umfänge laut deiner Excel (Wo 13). Erst Bekanntes, dann Versuche."],[null,"Di 12.01.","Turnen Di",null,null,null],[null,"Mi 13.01.",null,"A · 17:00 (RIR 2)","10:00","Normale Gym-Woche, alle Sätze."],[null,"Do 14.01.","Turnen Do","C · 09:00 (RIR 3)",null,"RIR 3, weil abends Reck/Barren."],[null,"Fr 15.01.",null,"B · 09:00 (RIR 2)",null,"Letzte volle Gym-Einheit vor dem Wettkampf."],["Wo 14 (18.–24.01.)","Mo/Di/Do","Turnen (reduziert)","nur Mi kurz","Mi","Wettkampf So 24.01. (Annahme)."]],"notes":["Ehrlich: Knapp 3 Wochen ohne Turnen und danach nur 2 Wochen bis zum Wettkampf sind das größte Risiko im Plan. Deshalb Kür-Entscheid bis 13.12. (Status-Blatt), nur was dann sicher steht. Am 21.12. letzte Bestätigung.","Ein klassischer Taper baut angesammelte Müdigkeit ab (Bosquet et al. 2007). Nach der Pause gibt es die nicht, darum ist Wo 13 eine normale Woche und nur Wo 14 kurz. Fürs Turnen gilt die Abstufung aus deiner Excel (Wo 13 ≈ 80 %, Wo 14 ≈ 45 % des Peaks).","Freiwillig, kein Muss: Wer möchte, kann in der Pause alle 2–3 Tage 10 min Spagat und Handstand an der Wand machen. Im Plan ist das nicht eingerechnet."]},"durations":[{"row":5,"unit":null,"est":"A (Mi)","measured":105},{"row":6,"unit":null,"est":"C (Do)","measured":85},{"row":7,"unit":null,"est":"B (Fr)","measured":120}],"notes":[{"date":"2026-10-21","topic":"Beispiel: Schulter","text":"Dips: rechts leichtes Ziehen unten, Schmerz 2/10, stabil → Tiefe reduziert."}]};

const ESTIMATE = {A:105, C:85, B:120};
const HILFE = PLAN.hilfeOptions || ['Partner','Weichboden','Trampolin','Doppelmini','Matte','ohne'];
/* Regeln über ein Stichwort finden (Nummern können sich ändern) */
function ruleBy(kw){ return PLAN.rules.find(r=>r.text.includes(kw)) || {nr:'', text:''}; }
function ruleShort(r){ const t=r.text; const i=t.indexOf(':'); return (i>0 && i<48) ? t.slice(0,i) : t.split(' ').slice(0,6).join(' ')+' …'; }
function ruleRef(kw, open){ const r=ruleBy(kw); if(!r.text) return ''; return `<details class="rule"${open?' open':''}><summary>Regel ${r.nr}: ${esc(ruleShort(r))}</summary><p>${esc(r.text)}</p></details>`; }
const RTXT = kw => ruleBy(kw).text;

/* ---------- storage ---------- */
function blank(){
  return {v:3, turn:{}, gym:{}, swim:{}, calc:{}, stufen:{boden:{},hand:{}}, lernstufe:{}, notes:[], form:{}, lastHilfe:{}, seenIntro:false,
          ovr:{goal:{}, role:{}, tmove:{}, gmove:{}, sets:{}}, prefs:{sound:true, wake:true, notify:true, dipsBW:false, auto:true, theme:'auto', dismissed:{}, adj:true, adjUp:true}};
}
function migrate(s){
  const o=Object.assign(blank(), s);
  o.ovr = Object.assign(blank().ovr, s.ovr||{}); o.form = s.form||{}; o.stufen = Object.assign({boden:{},hand:{}}, s.stufen||{}); o.lastHilfe=s.lastHilfe||{}; o.prefs=Object.assign({sound:true, wake:true, notify:true, dipsBW:false, auto:true, theme:'auto', dismissed:{}, adj:true, adjUp:true}, s.prefs||{}); o.ovr.noadj ||= {}; o.prefs.since ||= Date.now();
  if(!s.v || s.v<3){
    // Einträge von Übungsnummern (alter Plan) auf stabile Übungs-Schlüssel umstellen
    Object.values(o.turn).forEach(D=>{ const m=MIG[D.day]||{}; const n={};
      Object.entries(D.items||{}).forEach(([nr,e])=>{ const k=m[nr]; if(k){ if(e.hilfe==='mit') { e.hilfe=''; e.notiz=(e.notiz?e.notiz+' · ':'')+'mit Hilfe'; } n[k]=e; } });
      D.items=n; });
    const g={}; Object.entries(o.ovr.goal).forEach(([k,v])=>{ const [day,nr]=k.split(':'); const nk=(MIG[day]||{})[nr]; if(nk) g[`${day}:${nk}`]=v; }); o.ovr.goal=g;
  }
  o.v=3; o.ts=s.ts||0; return o;
}
function seed(s){
  (PLAN.turnLog||[]).forEach(e=>{
    const day = e.abend; const it = PLAN.turnen[day]?.items.find(i=>i.name===e.element); if(!it) return;
    const d = s.turn[e.date] ||= {day, items:{}};
    d.items[ikey(it)] = {done:e.versuche||0, seq:[], ok:e.gelungen??null, hilfe:e.hilfe||'', note:e.note||null, notiz:e.notiz||''};
  });
  (PLAN.notes||[]).forEach(n=>s.notes.push({id:uid(), date:n.date, topic:n.topic, text:n.text, pain:null}));
  PLAN.status.forEach(x=>{ s.lernstufe[x.element]=x.lernstufe||'A'; });
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){}
  return seed(blank());
}
function ikey(i){ return (i.id!=null && i.id!=='') ? 'i'+i.id : 'n'+i.name; }
let S = load();
function save(){ S.ts=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
/* Wenn ein anderes Fenster (z. B. Startbildschirm-App und Browser) neuer gespeichert hat: erst übernehmen, nie überschreiben */
function syncIn(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return false; const o=JSON.parse(raw); if((o.ts||0) > (S.ts||0)){ S=migrate(o); return true; } }catch(e){} return false; }
window.addEventListener('storage', e=>{ if(e.key===KEY && syncIn()) render(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && syncIn()) render(); });
window.addEventListener('pageshow', ()=>{ if(syncIn()) render(); });
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const dm = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function weekOf(d){ return Math.floor((d - START)/864e5/7)+1; }
function clampWeek(w){ return Math.max(1,Math.min(14,w)); }
const phaseIdx = w => w<=4?0:(w<=8?1:2);
const weekX = dateIso => (parse(dateIso)-START)/864e5/7 + 1;

/* ---------- plan logic ---------- */
function grpOf(i){
  if(i.section.startsWith('Einturnen')) return 'Einturnen';
  if(i.section.startsWith('Nur')) return DEV[i.device]?i.device:'Kondition';
  const g = i.section.split(/[\s·]/)[0]; return DEV[g]?g:(DEV[i.device]?i.device:'Kondition');
}
const dcol = g => `var(${DEV[g]?.c||'--d-kond'})`;
function goalOf(day, item, w){ const o=S.ovr.goal[`${day}:${ikey(item)}`]; return (o && o[w]!=null) ? o[w] : (item.w[w-1]||0); }
function isOvr(day,item,w){ const o=S.ovr.goal[`${day}:${ikey(item)}`]; return !!(o && o[w]!=null); }
function roleOf(item,w){ const ph=phaseIdx(w); const o=S.ovr.role[item.name]; const r = (o && o[ph]!=null) ? o[ph] : (item.roles||[])[ph]; return r && r!=='–' ? r : null; }
function unitParts(u){ const m=String(u||'').match(/^([^(]+)\(([^)]+)\)/); return m?{main:m[1].trim(), sub:m[2].trim()}:{main:u||'', sub:''}; }
/* Satz-Aufteilung wie in deiner Excel: z. B. 10 bei 4 pro Satz → 2×3 + 1×4 */
function splitSets(g, z){
  if(!z || g<=0) return null; if(g<=z) return [g];
  const n=Math.ceil(g/z), base=Math.floor(g/n), extra=g%n;
  return [...Array(extra).fill(base+1), ...Array(n-extra).fill(base)];
}
function parseSets(str){ if(!str) return null; const out=[]; str.split('+').forEach(p=>{ const m=p.trim().match(/(\d+)\s*×\s*(\d+)/); if(m) for(let k=0;k<+m[1];k++) out.push(+m[2]); }); return out.length?out:null; }
function setPlanOf(sess, i){
  const g=goalOf(sess.day,i,sess.w); if(!i.setSize || g<=0) return null;
  if(!isOvr(sess.day,i,sess.w)){ const p=parseSets(i.sets?.[sess.w-1]); if(p && p.reduce((a,b)=>a+b,0)===g) return p; }
  return splitSets(g, i.setSize);
}
const setLabel = arr => { if(!arr) return ''; const c={}; arr.forEach(x=>c[x]=(c[x]||0)+1); return Object.entries(c).sort((a,b)=>b[0]-a[0]).map(([v,n])=>`${n}×${v}`).join(' + '); };
function bodenProg(w, day){ const v=PLAN.bodenbahnen.schedule[w]?.[day]; if(!v || !/P\d/.test(v)) return null; return {prog:v.match(/P\d/)[0], landing:/L/.test(v.replace(/P\d/,''))}; }
function progActive(i, slot){
  if(i.program==='boden'){ const p=bodenProg(slot.w, slot.day); return !!(p && PLAN.bodenbahnen.programs[p.prog]); }
  const prog = PLAN.handstand.schedule[slot.w]?.[slot.day]; return !!(prog && PLAN.handstand.programs[prog]) && (i.w[slot.w-1]||0)>0;
}
function turnSlots(){
  const out=[];
  for(let w=1; w<=14; w++) for(const day of ['Mo','Di','Do']){
    const T=PLAN.turnen[day]; const orig=T.dates[w-1]; if(!orig) continue;
    const any=T.items.some(i=>!i.program && goalOf(day,i,w)>0); if(!any) continue;
    const key=`T${w}-${day}`; out.push({key, w, day, orig, date:S.ovr.tmove[key]||orig});
  }
  return out;
}
function turnSession(d){
  const slot = turnSlots().find(s=>s.date===iso(d)); if(!slot) return null;
  const T=PLAN.turnen[slot.day];
  const items = T.items.filter(i=> i.program ? progActive(i, slot) : goalOf(slot.day,i,slot.w)>0);
  return {...slot, T, items};
}
const gDate = g => S.ovr.gmove[g.id] || g.date;
function gymSession(d){ return PLAN.gym.find(g=>gDate(g)===iso(d)) || null; }
const setsOf = (g,it) => S.ovr.sets[`${g.id}:${it.nr}`] ?? (Number(it.sets)||1);
function swimToday(d){ const w=weekOf(d); return d.getDay()===3 && w>=1 && w<=14 && ![10,11,12].includes(w); }
function unitsOf(d){
  const u=[]; const g=gymSession(d), t=turnSession(d);
  if(swimToday(d)) u.push({kind:'swim', time:'10:00', label:'Schwimmen', id:'swim'});
  if(g){ const time=(g.header.match(/\d{2}:\d{2}/)||['09:00'])[0]; u.push({kind:'gym', time, label:'Gym '+unitLetter(g), id:'gym', g}); }
  if(t) u.push({kind:'turn', time:'19:00', label:'Turnen'+(t.date!==t.orig?' '+t.day+' (verschoben)':''), id:'turn', t});
  return u.sort((a,b)=>a.time.localeCompare(b.time));
}
function unitLetter(g){ const m=g.header.match(/Einheit ([^·]+)/); return m?m[1].trim():''; }

/* Körpergewicht bei Dips nur einrechnen, wenn eingeschaltet (Standard: aus = nur Zusatzgewicht) */
const bwEff = () => S?.prefs?.dipsBW ? PLAN.bodyweight : 0;
function e1(c){ if(!c||c.kg===''||c.kg==null||c.reps==null||c.reps==='') return null;
  const meta = PLAN.calc.find(x=>x.nr===c.nr); const bw = meta?.kgCounts ? bwEff() : 0;
  return (Number(c.kg)+bw)*(1+(Number(c.reps)+Number(c.rir||0))/30); }
/* Bei Dips: e1RM ist Gesamtlast (Körper + Zusatz). Zusatz-Anteil getrennt zeigen. */
const kgCounts = nr => !!PLAN.calc.find(x=>x.nr===nr)?.kgCounts && bwEff()>0;
const e1Zus = (nr, v) => v==null ? null : (kgCounts(nr) ? v-PLAN.bodyweight : v);
function e1Txt(nr, v){ if(v==null) return ''; return kgCounts(nr) ? `${fmt(Math.round(v))} kg gesamt · Zusatz ${fmt(Math.round(v-PLAN.bodyweight))} kg` : `${fmt(Math.round(v))} kg`; }
/* Kurze Übungsnamen: lange Beschreibungen erst aufgeklappt zeigen */
function shortName(n, lim=50){ n=String(n||''); if(n.length<=lim) return {s:n, rest:''}; const m=n.slice(8).search(/:| \(|,| · /); if(m<0) return {s:n, rest:''};
  const i=m+8; return {s:n.slice(0,i).trim(), rest:n.slice(i).replace(/^(:|,| · )\s*/,'').trim()}; }
function dayPct(x){ const u=unitsOf(x); if(!u.length) return null; const v=u.map(z=> z.kind==='turn'? groupStats(z.t,z.t.items).pct : z.kind==='gym'? gymProgress(z.g).pct : (S.swim[iso(x)]?.done?1:0)); return v.reduce((a,b)=>a+b,0)/v.length; }
function applyTheme(){ const m=S?.prefs?.theme||'auto'; const light = m==='light' || (m==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = light?'light':'dark'; const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute('content', light?'#ffffff':'#1c1f22'); }
try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if((S.prefs.theme||'auto')==='auto') applyTheme(); }); }catch(e){}
function okeyDone(key){ try{
  if(key.startsWith('it:')){ const dIso=key.slice(3,13), k=key.slice(14); const sess=turnSession(parse(dIso)); const i=sess?.T.items.find(x=>ikey(x)===k); if(!i || i.program || i.status==='Versuch') return null; const g=goalOf(sess.day,i,sess.w); if(g<=0) return null; return (S.turn[dIso]?.items?.[k]?.done||0)>=g; }
  if(key.startsWith('g:')){ const [,gid,nr]=key.split(':'); const g=PLAN.gym.find(x=>x.id===gid); const it=g?.items.find(x=>String(x.nr)===nr); if(!it) return null; return (S.gym[gid]?.items?.[nr]?.sets||[]).filter(x=>x.done).length>=setsOf(g,it); }
  }catch(e){} return null; }
function nextOpenKey(key){
  if(key.startsWith('it:')){ const dIso=key.slice(3,13), k=key.slice(14); const sess=turnSession(parse(dIso)); if(!sess) return null; const cur=sess.T.items.find(x=>ikey(x)===k);
    const order = UI.dev==='Alle' ? sessGroups(sess).flatMap(x=>sess.items.filter(i=>grpOf(i)===x.g)) : sess.items.filter(i=>grpOf(i)===grpOf(cur));
    const idx=order.indexOf(cur); const nx=order.slice(idx+1).find(i=>!i.program && goalOf(sess.day,i,sess.w)>0 && !itemDone(sess,i)); return nx ? 'it:'+dIso+':'+ikey(nx) : null; }
  if(key.startsWith('g:')){ const [,gid,nr]=key.split(':'); const g=PLAN.gym.find(x=>x.id===gid); const idx=g.items.findIndex(x=>String(x.nr)===nr);
    const nx=g.items.slice(idx+1).find(it=>(S.gym[gid]?.items?.[it.nr]?.sets||[]).filter(x=>x.done).length<setsOf(g,it)); return nx ? 'g:'+gid+':'+nx.nr : null; }
  return null; }
function turnRecap(sess, dIso){ const D=S.turn[dIso]||{}; const gs=sessGroups(sess).filter(x=>x.st.cnt>0);
  let V=0,G=0; sess.items.filter(i=>i.status==='Versuch').forEach(i=>{ const e=D.items?.[ikey(i)]; if(e){ V+=e.done||0; G+=okCount(e)||0; } });
  const open=sess.items.filter(i=>!i.program && goalOf(sess.day,i,sess.w)>0 && !itemDone(sess,i)).map(i=>shortName(i.name).s);
  const more=sess.items.filter(i=>{ const g=goalOf(sess.day,i,sess.w); return g>0 && (D.items?.[ikey(i)]?.done||0)>g; }).length;
  const all=groupStats(sess,sess.items);
  return `<div class="recap"><div class="stats"><div class="stat"><b class="num">${all.fin}/${all.cnt}</b><span>Übungen</span></div><div class="stat"><b class="num">${G}/${V}</b><span>Versuche gelungen</span></div><div class="stat"><b class="num">${more}</b><span>mehr als geplant</span></div></div>
    <div class="rdev">${gs.map(x=>`<span style="--dc:${dcol(x.g)}"><i></i>${DEV[x.g].label} <b>${x.st.fin}/${x.st.cnt}</b></span>`).join('')}</div>
    ${open.length?`<p class="small muted">Offen geblieben: ${open.slice(0,8).map(esc).join(' · ')}${open.length>8?` · +${open.length-8}`:''}</p>`:'<p class="small" style="color:var(--ok)">Alles geschafft 💪</p>'}</div>`; }
function gymRecap(g){ const pr=gymProgress(g); const L=S.gym[g.id]||{}; let vol=0;
  g.items.forEach(it=>(L.items?.[it.nr]?.sets||[]).forEach(x=>{ if(x.done && Number(x.kg)>0 && Number(x.reps)>0) vol+=Number(x.kg)*Number(x.reps); }));
  const prs=[]; PLAN.calc.forEach(c=>{ const pts=e1Series(c); const cur=pts.find(p=>p.date===gDate(g)); const prev=pts.filter(p=>p.date<gDate(g)); const base=Math.max(...prev.map(p=>p.y), e1rm(c.nr,'A')||0);
    if(cur && base>0 && cur.y>base+0.4) prs.push(`${c.name}: e1RM ${fmt(Math.round(cur.y))} kg (+${fmt(Math.round(cur.y-base))})`); });
  const open=g.items.filter(it=>(L.items?.[it.nr]?.sets||[]).filter(x=>x.done).length<setsOf(g,it)).map(it=>shortName(it.name,40).s);
  return `<div class="recap"><div class="stats"><div class="stat"><b class="num">${pr.fin}/${pr.tot}</b><span>Sätze</span></div><div class="stat"><b class="num">${fmt(Math.round(vol/10)*10)}</b><span>kg bewegt</span></div><div class="stat"><b class="num">${prs.length}</b><span>Bestwerte</span></div></div>
    ${prs.length?`<div class="prs">${prs.map(t=>`<div>🏆 ${esc(t)}</div>`).join('')}</div>`:''}
    ${open.length?`<p class="small muted">Offen geblieben: ${open.map(esc).join(' · ')}</p>`:'<p class="small" style="color:var(--ok)">Alles geschafft 💪</p>'}</div>`; }
function calcTest(nr, st){
  const o = S.calc[nr]?.[st]; if(o) return {...o, nr};
  const base = PLAN.calc.find(x=>x.nr===nr)?.[st]; return base?{...base,nr}:null;
}
function e1rm(nr, st){ let val=null; for(const s of ['A','B','C']){ const v=e1(calcTest(nr,s)); if(v!=null) val=v; if(s===st) break; } return val; }
const r25 = x => Math.round(x/2.5)*2.5;
/* ----- Dynamische Anpassung: Basis-e1RM folgt deinen Ergebnissen, die Steigerung des Plans bleibt ----- */
const IT2G = new Map(); PLAN.gym.forEach(g=>g.items.forEach(it=>IT2G.set(it,g)));
function baseOf(it){ const t=it.target||{}; if(t.type==='lt'){ const nr=PLAN.ltLiftCalc[t.lift], st=PLAN.ltStates[t.week-1]; return {nr, st, v:e1rm(nr,st)}; } if(t.type==='calc') return {nr:t.calc, st:t.state, v:e1rm(t.calc,t.state)}; return null; }
const evalItem = it => { const t=it.target||{}; return t.type==='calc' || (t.type==='lt' && t.kind==='heavy'); };
let HC={ts:-1, map:null};
function liftHist(){ if(HC.ts===(S.ts||0) && HC.map) return HC.map; const map={};
  PLAN.gym.slice().sort((a,b)=>gDate(a).localeCompare(gDate(b))).forEach(g=>{ const f=S.form[g.id]; if(f && formScore(f)<=2.34) return; const L=S.gym[g.id]; if(!L) return;
    g.items.forEach(it=>{ if(!evalItem(it)) return; const I=L.items?.[it.nr]; if(!I || (I.alt && it.alt)) return; const b=baseOf(it); if(!b || !b.v) return; const rm=String(it.rir).match(/\d+/);
      let best=null; (I.sets||[]).forEach(x=>{ if(!x.done || x.kg==='' || x.kg==null || !Number(x.reps)) return; const rir = (x.rir===''||x.rir==null) ? (rm?Number(rm[0]):0) : Number(x.rir);
        const v=e1({nr:b.nr, kg:Number(x.kg), reps:Number(x.reps), rir}); if(v!=null && (!best||v>best.v)) best={v, x:{...x, rir}}; });
      if(best) (map[b.nr] ||= []).push({date:gDate(g), gid:g.id, st:b.st, r:best.v/b.v, set:best.x}); }); });
  HC={ts:S.ts||0, map}; return map; }
function adjInfo(it){ const g=IT2G.get(it); const b=baseOf(it); if(!g || !b || !b.v) return null;
  const h=(liftHist()[b.nr]||[]).filter(x=>x.date<gDate(g) && x.st===b.st); if(!h.length) return null;
  const last=h[h.length-1]; let f=1, why='';
  if(last.r < 0.97){ f=Math.max(0.9,(1+last.r)/2); why='down'; }
  else if(S.prefs.adjUp!==false && h.length>=2){ const p=h[h.length-2]; if(last.r>1.03 && p.r>1.03){ f=Math.min(1.05,(1+Math.min(last.r,p.r))/2); why='up'; } }
  if(f===1) return null; return {f, why, last}; }
function adjFactor(it){ if(S.prefs.adj===false) return 1; const g=IT2G.get(it); if(g && S.ovr.noadj?.[g.id+':'+it.nr]) return 1; return adjInfo(it)?.f || 1; }
function target(item, planOnly){
  const t = item.target||{}; const f = planOnly ? 1 : adjFactor(item);
  if(t.type==='lt'){ const st = PLAN.ltStates[t.week-1]; const lt = PLAN.weeks[t.week-1].lt;
    const v = e1rm(PLAN.ltLiftCalc[t.lift], st); if(v==null) return 'testen'; return r25(v*f*(t.kind==='heavy'?lt.pctHeavy:lt.pctLight)); }
  if(t.type==='calc'){ const v = e1rm(t.calc, t.state); if(v==null) return 'testen'; const bw = t.kg?bwEff():0; return Math.max(0, r25(v*f/(1+t.k/30)-bw)); }
  return t.value ?? null;
}
function pauseSec(p){ if(!p) return 0; const m=String(p).replace(',','.').match(/([\d.]+)(?:\s*[–-]\s*[\d.]+)?\s*min/); return m?Math.round(parseFloat(m[1])*60):0; }
function repsRange(r){ const m=String(r).match(/^(\d+)(?:\s*[–-]\s*(\d+))?(?!\s*min)/); if(!m||/min/.test(r)) return null; return {lo:+m[1], hi:+(m[2]||m[1])}; }
const exKey = n => n.split(' · ')[0].trim();

function sessDay(date){ return turnSession(parse(date))?.day || S.turn[date]?.day || null; }
function tEntry(date,k,create){
  if(!S.turn[date]){ if(!create) return null; S.turn[date]={day:sessDay(date), items:{}}; }
  const dd=S.turn[date]; if(!dd.day) dd.day=sessDay(date);
  return dd.items[k] || (create ? (dd.items[k]={done:0, seq:[], ok:null, hilfe:'', note:null, notiz:''}) : null);
}
function okCount(e){ if(!e) return 0; if(e.seq&&e.seq.length) return e.seq.filter(x=>x===true).length; return e.ok||0; }
function seqOf(e){ if(!e) return []; if(!e.seq) e.seq=[]; if(!e.seq.length && e.done>0) e.seq=Array(e.done).fill(null); return e.seq; }
function graded(e){ return !!(e?.seq && e.seq.some(x=>x!==null)); }
function ticksOf(e, plan){ if(!plan) return []; if(e?.setsDone && e.setsDone.length===plan.length) return e.setsDone.slice(); let left=e?.done||0; return plan.map(v=>{ if(left>=v){ left-=v; return true; } return false; }); }
function groupStats(sess, items){
  let tot=0, done=0, fin=0, cnt=0;
  items.forEach(i=>{ if(i.program) return; const goal=goalOf(sess.day,i,sess.w); if(goal<=0) return; const e=S.turn[sess.date]?.items[ikey(i)]; const d=Math.min(goal,e?.done||0);
    tot+=goal*i.sec; done+=d*i.sec; cnt++; if(d>=goal) fin++; });
  return {min:tot/60, doneMin:done/60, remMin:(tot-done)/60, pct: tot?done/tot:(cnt?fin/cnt:0), fin, cnt};
}
function sessGroups(sess){
  const order=[]; const map={};
  sess.items.forEach(i=>{ const g=grpOf(i); if(!map[g]){ map[g]=[]; order.push(g); } map[g].push(i); });
  return order.map(g=>({g, items:map[g], st:groupStats(sess,map[g])})).filter(x=>x.st.cnt>0 || x.items.some(i=>i.program));
}
function gymProgress(g){
  const L=S.gym[g.id]; let tot=0, fin=0;
  g.items.forEach(it=>{ const n=setsOf(g,it); tot+=n; fin+=Math.min(n,(L?.items?.[it.nr]?.sets||[]).filter(s=>s.done).length); });
  return {tot, fin, pct: tot?fin/tot:0};
}
function hsExercise(name){ const n = name.toLowerCase(); return PLAN.handstand.exercises.find(x=>{ const k=x.name.split(/[(:]/)[0].trim().toLowerCase(); return n.startsWith(k); }); }
function itemDone(sess, i){ const g=goalOf(sess.day,i,sess.w); const e=S.turn[sess.date]?.items[ikey(i)]; return g>0 && (e?.done||0)>=g; }

/* ---------- charts ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function weekBars(data, opt){
  const W=340, H=150, L=34, R=6, T=10, B=22; const iw=W-L-R, ih=H-T-B;
  const max=niceMax(Math.max(1,...data.map(d=>Math.max(d.plan,d.done)))); const bw=iw/data.length; const cw=Math.min(16,bw-6);
  const y=v=>T+ih-(v/max)*ih; const cur=clampWeek(weekOf(today()));
  let g=''; [0,.5,1].forEach(f=>{ const v=max*f; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  data.forEach((d,k)=>{ const x=L+k*bw+(bw-cw)/2; const r=Math.min(4,cw/2);
    const bar=(v,cls)=>{ if(v<=0) return ''; const h=y(0)-y(v); const rr=Math.min(r,h); return `<path class="${cls}" d="M${x},${y(0)} V${y(v)+rr} q0,-${rr} ${rr},-${rr} h${cw-2*rr} q${rr},0 ${rr},${rr} V${y(0)} Z"/>`; };
    g+=bar(d.plan,'plan')+bar(d.done,'done');
    g+=`<text x="${x+cw/2}" y="${H-6}" text-anchor="middle" class="${d.w===cur?'cur':''}">${d.w}</text>`;
    g+=`<rect class="hit" x="${L+k*bw}" y="${T}" width="${bw}" height="${ih}" data-tip="Wo ${d.w}: ${fmt(Math.round(d.done*10)/10)} von ${fmt(Math.round(d.plan*10)/10)} ${opt.unit}" data-act="selweek" data-v="${d.w}"/>`; });
  g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${g}</svg>`;
}
function lineChart(series, opt){
  const W=opt.w||340, H=opt.h||160, L=36, R=10, T=14, B=22; const iw=W-L-R, ih=H-T-B;
  const ys=[...series.flatMap(s=>s.pts.map(p=>p.y)), ...(opt.step||[]).map(s=>s.y)]; if(!ys.length) return '';
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(opt.y0==null||opt.y1==null){ if(hi-lo<2){ hi+=2; lo-=2; } const pd=(hi-lo)*0.15; lo-=pd; hi+=pd; }
  if(opt.y0!=null) lo=opt.y0; if(opt.y1!=null) hi=opt.y1;
  const x=v=>L+(v-1)/14*iw, y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  let g=''; const ticks=opt.yticks || [lo+(hi-lo)*0.15, (lo+hi)/2, hi-(hi-lo)*0.15].map(v=>Math.round(v));
  ticks.forEach(v=>{ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  [1,5,9,13].forEach(w=>{ g+=`<text x="${x(w+0.5)}" y="${H-6}" text-anchor="middle">Wo ${w}</text>`; });
  g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  (opt.step||[]).forEach(s=>{ g+=`<line class="step" x1="${x(s.x0)}" x2="${x(s.x1)}" y1="${y(s.y)}" y2="${y(s.y)}"/><rect class="hit" x="${x(s.x0)}" y="${y(s.y)-8}" width="${x(s.x1)-x(s.x0)}" height="16" data-tip="Plan-Stand Wo ${s.x0}–${s.x1-1}: ${fmt(Math.round(s.y))} kg"/>`; });
  series.forEach(s=>{
    if(s.pts.length>1) g+=`<path class="ln" style="stroke:${s.color}" d="${s.pts.map((p,k)=>(k?'L':'M')+x(p.x).toFixed(1)+','+y(p.y).toFixed(1)).join(' ')}"/>`;
    s.pts.forEach((p,k)=>{ const last=k===s.pts.length-1; g+=`<circle cx="${x(p.x)}" cy="${y(p.y)}" r="${last?5:4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${x(p.x)}" cy="${y(p.y)}" r="14" data-tip="${esc(p.tip)}"/>`; });
    const lp=s.pts[s.pts.length-1]; if(lp && opt.endLabel){ const right=x(lp.x)>W-60; g+=`<text x="${right?x(lp.x)-8:x(lp.x)+8}" y="${y(lp.y)-8}" text-anchor="${right?'end':'start'}" class="cur">${fmt(Math.round(lp.y))}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'')}">${g}</svg>`;
}

function vTraining(){
  const d=UI.date, w=weekOf(d), dIso=iso(d);
  if(w<1||w>14) return `<div class="card"><h2>Außerhalb des Plans</h2><p class="muted">Der Plan läuft vom 19.10.2026 bis 24.01.2027.</p><div class="row" style="margin-top:10px"><button class="btn primary" data-act="date" data-v="2026-10-19">Zu Woche 1</button></div></div>`;
  const W=PLAN.weeks[w-1]; const units=unitsOf(d);
  let out=vIntro();
  const cp = checkpoints().find(c=>{ const diff=(parse(c.date)-d)/864e5; return diff>=0 && diff<=6; });
  const notes=[W.note?esc(W.note):'', cp?`<b>${dm(parse(cp.date))}</b> ${esc(cp.text)}`:''].filter(Boolean);
  const nkey = 'n'+[...notes.join('|')].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
  if(notes.length && !S.prefs.dismissed?.[nkey]) out += `<div class="dayinfo ${UI.open.dayinfo?'open':''}"><button type="button" class="dt" data-act="toggle" data-v="dayinfo"><span>ℹ</span><span class="t">${notes.join(' · ')}</span></button><button type="button" class="dx" data-act="dismiss" data-v="${nkey}" aria-label="Hinweis ausblenden">✕</button></div>`;
  out += vBackupNag();
  if(!units.length){
    out += `<h2>${WD[d.getDay()]}, ${dm(d)}</h2>`;
    const n=nextTraining(d);
    out += `<div class="card stack"><h2>Trainingsfrei</h2>${n?`<p class="muted">Nächstes Training: ${WD[n.d.getDay()]} ${dm(n.d)} · ${n.u.map(u=>u.label+' '+u.time).join(', ')}</p><div class="row"><button class="btn primary" data-act="date" data-v="${iso(n.d)}">Hinspringen</button></div>`:''}</div>`;
    return out;
  }
  if(!UI.unit || !units.some(u=>u.id===UI.unit)){
    const now=new Date(); let pick=units[units.length-1];
    if(dIso===iso(today())){ for(const u of units){ const [h,m]=u.time.split(':').map(Number); if(now.getHours()*60+now.getMinutes() < h*60+m+150){ pick=u; break; } } }
    else pick = units.find(u=>u.kind!=='swim')||units[0];
    UI.unit = pick.id;
  }
  if(units.length>1) out += `<div class="units" role="tablist">${units.map(u=>{ const dn = u.kind==='turn'? groupStats(u.t,u.t.items).pct>=1 : u.kind==='gym'? gymProgress(u.g).pct>=1 : !!S.swim[dIso]?.done;
    return `<button type="button" role="tab" class="unit ${UI.unit===u.id?'on':''}" data-act="unit" data-v="${u.id}">${u.label} · ${u.time}${dn?'<span class="dot"></span>':''}</button>`; }).join('')}</div>`;
  const u = units.find(x=>x.id===UI.unit);
  if(u.kind==='turn') out += vTurn(u.t, dIso);
  if(u.kind==='gym') out += vGym(u.g);
  if(u.kind==='swim') out += vSwim(dIso);
  return out;
}

const FORMQ = [['sleep','Schlaf'],['energy','Energie'],['body','Körper']];
const FORMHINT = {sleep:'1 kaum · 5 super', energy:'1 leer · 5 voll da', body:'1 Muskelkater · 5 frisch'};
const formScore = f => f? (f.sleep+f.energy+f.body)/3 : null;
function prevForm(key){ const f=S.form[key]; if(!f) return null; const others=Object.entries(S.form).filter(([k,v])=>k!==key && v.ts<f.ts).sort((a,b)=>b[1].ts-a[1].ts); return others[0]?.[1]||null; }
function vFormPanel(key, act){
  const f=UI.formDraft||{}; const ready=FORMQ.every(([k])=>f[k]);

}
function vFormNote(key, isGym){

  return `<div class="note warn small stack" style="gap:6px"><div><b>Tagesform ${fmt(Math.round(sc*10)/10)} / 5 – eher schwach.</b> ${isGym?'Überleg, die Einheit zu verschieben oder nur die Hauptübungen zu machen.':'Turnen geht vor: heute ruhig weniger Wiederholungen.'}</div>

function vTurn(sess, dIso){
  const T=sess.T, w=sess.w, D=S.turn[dIso]||{};
  const groups = sessGroups(sess); const all = groupStats(sess, sess.items);
  const planMin = all.min+30;
  const endPlan = new Date(parse(dIso)); endPlan.setHours(19,0,0,0); endPlan.setMinutes(endPlan.getMinutes()+Math.round(planMin));
  const fkey='T-'+dIso;
  let live='';
  if(D.start && !D.end){ const rest=all.remMin+30*(1-all.pct); const fin=new Date(Date.now()+rest*60e3); live=`fertig ca. ${hm(fin)}`; }
  if(D.start && D.end) live=`${Math.round((D.end-D.start)/60e3)} min`;
  const twoInRow = turnSession(addDays(parse(dIso),-1)) || turnSession(addDays(parse(dIso),1));
  // aktuelles Gerät: zuletzt gewähltes, sonst das erste nicht fertige
  if(UI.devFor!==dIso || (UI.dev!=='Alle' && !groups.some(x=>x.g===UI.dev))){ const firstOpen=groups.find(x=>x.st.cnt>0 && x.st.fin<x.st.cnt) || groups[0]; UI.dev=firstOpen?firstOpen.g:null; UI.devFor=dIso; }
  const title = (T.title.split(' · ')[0]||'Turnen').toUpperCase();
  let html = `<div class="sesshead"><div class="ttl"><b>${esc(title)}</b><span>19–22 Uhr · ${all.fin}/${all.cnt} erledigt${live?' · '+live:''}</span></div>
    ${!D.start? (UI.formFor===fkey?'':`<button class="btn primary" data-act="formopen" data-v="${fkey}">▶ Start</button>`) : !D.end?`<button class="btn" data-act="tend">■ Ende</button>`:`<span class="small muted">beendet</span>`}
    <button class="icon-btn" data-act="menu" aria-label="Weitere Optionen">⋯</button></div>
    ${UI.formFor===fkey?`<div class="card">${vFormPanel(fkey,'tstart')}</div>`:''}
    ${UI.menu?`<div class="card stack"><p class="small muted">Plan ${Math.round(planMin)} min · Ende ca. ${hm(endPlan)} · ${all.fin}/${all.cnt} Übungen erledigt</p>
      <div class="compo" role="img" aria-label="Zeitanteile der Geräte">${groups.filter(x=>x.st.min>0).map(x=>`<span style="flex:${x.st.min.toFixed(2)};background:${dcol(x.g)}" data-tip="${DEV[x.g].label}: ${Math.round(x.st.min)} min"></span>`).join('')}</div>
      ${vMenu([
      {act:'showall', label: UI.showAll?'Nur geplante Übungen zeigen':'Alle Übungen der Geräte zeigen', sub:'auch Übungen mit Soll 0 in dieser Woche'},
      {act:'moveopen', v:sess.key, label:'Training verschieben', sub:'auf einen anderen Tag'},
      {act:'toggle', v:'hints', label: UI.open.hints?'Hinweise ausblenden':'Schwerpunkt, Hinweise und Regeln', sub:'warum der Abend so aufgebaut ist'},
      ...(D.start?[{act:'treset', label:'Zeitmessung zurücksetzen'}]:[])

function setRowsUI(i, e, goal, plan, up, isSec){

function setsDoneCount(e, plan){ if(!plan) return 0; if(e?.inc){ let n=0; for(const [s,v] of plan.entries()){ if((e.inc[s]||0)>=v) n++; else break; } return Math.max(n, e.inc.length>plan.length?plan.length:n); } let left=e?.done||0, n=0; for(const v of plan){ if(left>=v){ left-=v; n++; } else break; } return n; }

  return {step: isSec?5:1, plan:null, n:0};
}

/* ----- Fortschritt-Daten ----- */
function weekProgress(metric){
  const rows=[...Array(14)].map((_,k)=>({w:k+1, plan:0, done:0}));
  if(metric==='gym'){
    PLAN.gym.forEach(g=>{ const w=parseInt(g.code.slice(1)); const L=S.gym[g.id]; g.items.forEach(it=>{ const n=setsOf(g,it); rows[w-1].plan+=n; rows[w-1].done+=Math.min(n,(L?.items?.[it.nr]?.sets||[]).filter(s=>s.done).length); }); });
    return rows;
  }
  turnSlots().forEach(sl=>{ const T=PLAN.turnen[sl.day];
    T.items.forEach(i=>{ if(i.program) return; const goal=goalOf(sl.day,i,sl.w); if(goal<=0) return;
      const hand = metric==='hand'; if(hand && !(grpOf(i)==='Handstand')) return;
      const e=S.turn[sl.date]?.items[ikey(i)]; const d=Math.min(goal,e?.done||0);
      if(hand){ rows[sl.w-1].plan+=goal; rows[sl.w-1].done+=d; } else { rows[sl.w-1].plan+=goal*i.sec/60; rows[sl.w-1].done+=d*i.sec/60; } }); });
  return rows;
}
function e1Series(c){
  const pts=[];
  PLAN.gym.slice().sort((a,b)=>gDate(a).localeCompare(gDate(b))).forEach(g=>{ let best=null;
    g.items.forEach(it=>{ if(!exKey(it.name).startsWith(c.name)) return; (S.gym[g.id]?.items?.[it.nr]?.sets||[]).forEach(s=>{ if(!s.done||s.kg===''||!s.reps||s.rir===''||s.rir==null) return; const v=e1({nr:c.nr,kg:Number(s.kg),reps:Number(s.reps),rir:Number(s.rir)}); if(!best||v>best.v) best={v,s}; }); });
    if(best) pts.push({x:weekX(gDate(g)), y:best.v, date:gDate(g), s:best.s, tip:`${dm(parse(gDate(g)))}: ${fmt(Number(best.s.kg))} kg × ${best.s.reps} @ RIR ${best.s.rir} → e1RM ${fmt(Math.round(best.v))}`}); });
  return pts;
}
function e1Step(c){ const out=[]; PLAN.ltStates.forEach((st,k)=>{ if(!st) return; const v=e1rm(c.nr,st); if(v==null) return; const last=out[out.length-1]; if(last && Math.abs(last.y-v)<0.01 && last.x1===k+1) last.x1=k+2; else out.push({x0:k+1,x1:k+2,y:v}); }); return out; }

function statOptions(){

  const turn={}; ['Mo','Di','Do'].forEach(d=>PLAN.turnen[d].items.forEach(i=>{ if(i.program) return; const g=grpOf(i); (turn[g] ||= new Set()).add(i.name); }));

function statSeriesTurn(name){
  const pts=[]; const td=iso(today());
  turnSlots().forEach(sl=>{ const it=PLAN.turnen[sl.day].items.find(i=>i.name===name); if(!it) return; const goal=goalOf(sl.day,it,sl.w); const e=S.turn[sl.date]?.items[ikey(it)]; const done=e?.done||0;
    if(goal<=0 && !done) return;
    pts.push({date:sl.date, day:sl.day, w:sl.w, x:weekX(sl.date), plan:goal, done, ok: it.status==='Versuch' ? (graded(e)?okCount(e):(e?.ok??null)) : null, past: sl.date<=td, item:it, unit:unitParts(it.unit).main}); });

}
function statSeriesGym(key){
  const pts=[]; const td=iso(today());
  PLAN.gym.slice().sort((a,b)=>gDate(a).localeCompare(gDate(b))).forEach(g=>g.items.forEach(it=>{ if(exKey(it.name)!==key) return;
    const I=S.gym[g.id]?.items?.[it.nr]; const dn=(I?.sets||[]).filter(s=>s.done && s.kg!=='' && s.kg!=null);
    const tg=target(it); const c=PLAN.calc.find(c=>key.startsWith(c.name));

    const reps = dn.length? dn.reduce((a,s)=>a+Number(s.reps||0),0)/dn.length : null;
    const e1v = (c && dn.length) ? Math.max(...dn.map(s=>e1({nr:c.nr,kg:Number(s.kg),reps:Number(s.reps||0),rir:Number(s.rir||0)}))) : null;
    const rr=repsRange(it.reps);
    pts.push({date:gDate(g), x:weekX(gDate(g)), w:parseInt(g.code.slice(1)), unit:unitLetter(g), plan:typeof tg==='number'?tg:null, kg, reps, repsPlan: rr?rr.hi:null, sets:dn.length, setsPlan:setsOf(g,it), e1:e1v, past:gDate(g)<=td, label:it.name});

function timeBars(pts, opt){

/* ----- Zyklus-Grafik (Makro / Meso / Mikro) ----- */
const PHASECOL = {Intro:'var(--d-warm)', 'Build 1':'var(--d-reck)', 'Build 2':'var(--d-barren)', Entlastung:'var(--d-boden)', Attack:'var(--d-ringe)', Pause:'var(--sunk)', Erhalt:'var(--d-kond)', Normal:'var(--d-reck)', Taper:'var(--d-sprung)'};

const PHASETXT = {Intro:'Einstieg, Gewichte finden', 'Build 1':'Aufbau, Volumen', 'Build 2':'Aufbau, schwerer', Entlastung:'Entlastung ≈ 80 %', Attack:'schwerste Woche', Pause:'trainingsfrei', Erhalt:'nur Erhalt', Normal:'Wiedereinstieg', Taper:'Taper vor Wettkampf'};
function cycleData(){
  const turnP = weekProgress('turn'), gymP = weekProgress('gym');
  const w1 = PLAN.gym.filter(g=>g.code==='W01'); const s1 = w1.reduce((a,g)=>a+g.items.reduce((b,it)=>b+setsOf(g,it),0),0);
  const m1 = (PLAN.durations||[]).reduce((a,d)=>a+(Number(d.measured)||0),0);
  const mps = s1 && m1 ? m1/s1 : 3.5;
  return PLAN.weeks.map((W,k)=>{
    const tPlan = (W.turnMin.Mo+W.turnMin.Di+W.turnMin.Do)/60;
    const tr = turnP[k].plan ? turnP[k].done/turnP[k].plan : 0;
    const gPlan = gymP[k].plan*mps/60, gDone = gymP[k].done*mps/60;
    const pct = typeof W.lt?.pctHeavy==='number' ? W.lt.pctHeavy : null;
    return {w:W.wo, W, tPlan, tDone:tPlan*tr, gPlan, gDone, pct, rir:W.lt?.rirZiel, state:W.lt?.state};
  });
}
function segs(arr){ const out=[]; arr.forEach((v,k)=>{ const l=out[out.length-1]; if(l && l.v===v) l.n++; else out.push({v,s:k,n:1}); }); return out; }
function vCycle(){
  const mode = UI.cyc || 'komb'; const D = cycleData(); const cw = clampWeek(weekOf(today())); const sel = UI.cycW || cw;
  const Wd=360, L=34, R=mode==='gym'?28:8, top=14, H=120, cwid=(Wd-L-R)/14, bw=cwid*0.66;
  const val = d => mode==='turn'?[[d.tPlan,d.tDone,'var(--d-hand)']]:mode==='gym'?[[d.gPlan,d.gDone,'var(--accent)']]:[[d.tPlan,d.tDone,'var(--d-hand)'],[d.gPlan,d.gDone,'var(--accent)']];
  const max = Math.max(1, ...D.map(d=>val(d).reduce((a,x)=>a+x[0],0)))*1.12;
  const step = max>12?4:max>6?2:1; const y = v => top+H-v/max*H; const x = k => L+k*cwid+cwid/2;
  let g = '';
  for(let v=0; v<=max; v+=step) g += `<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" class="cy-ax">${v}h</text>`;
  // Phasen-Hintergrund
  segs(D.map(d=>d.W.phase)).forEach(sg=>{ if(sg.v==='Pause') g += `<rect x="${L+sg.s*cwid}" y="${top}" width="${sg.n*cwid}" height="${H}" fill="var(--sunk)" opacity=".55"/>`; });
  // Woche markiert
  g += `<rect x="${L+(sel-1)*cwid+1}" y="${top-6}" width="${cwid-2}" height="${H+6}" rx="4" fill="var(--accent)" opacity=".12"/>`;
  D.forEach((d,k)=>{ let base=0;
    val(d).forEach(([pl,dn,c])=>{ if(pl<=0) return; const y0=y(base), y1=y(base+pl);
      g += `<rect x="${x(k)-bw/2}" y="${y1}" width="${bw}" height="${y0-y1}" rx="2" fill="${c}" opacity=".26"/>`;
      if(dn>0){ const yd=y(base+Math.min(dn,pl*1.5)); g += `<rect x="${x(k)-bw/2}" y="${yd}" width="${bw}" height="${y0-yd}" rx="2" fill="${c}"/>`; }
      base+=pl; }); });
  // Trend (gleitender Schnitt wie Fitness-Kurve)
  const ew = (arr)=>{ let e=null; return arr.map(v=>e = e==null? v : e+0.4*(v-e)); };
  const tot = D.map(d=>val(d).reduce((a,x)=>a+x[0],0)); const totD = D.map(d=>val(d).reduce((a,x)=>a+x[1],0));
  const tp = ew(tot); g += `<polyline points="${tp.map((v,k)=>`${x(k)},${y(v)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-dasharray="3 3" opacity=".7"/>`;
  if(totD.some(v=>v>0)){ const lastD = totD.reduce((m,v,k)=>v>0?k:m,-1); const td = ew(totD).slice(0,lastD+1); g += `<polyline points="${td.map((v,k)=>`${x(k)},${y(v)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`; }
  // Intensität Gym

    g += [0.6,0.7,0.8,0.9].map(v=>`<text x="${Wd-R+3}" y="${yp(v)+3}" class="cy-ax" fill="var(--warn)">${Math.round(v*100)}%</text>`).join('');
    let path=''; pts.forEach((p,k)=>{ if(!p) return; path += (k&&pts[k-1]?'L':'M')+p[0]+','+p[1]; }); g += `<path d="${path}" fill="none" stroke="var(--warn)" stroke-width="1.6"/>${pts.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="var(--warn)"/>`).join('')}`; }

    segs(arr).forEach(sg=>{ const bx=L+sg.s*cwid+1, bwid=sg.n*cwid-2; const full=txtf(sg.v,true), ab=txtf(sg.v,false); const t = full.length*4.6 < bwid ? full : ab.length*4.6<bwid ? ab : '';

    by += h+3; return o; };
  g += band('Makro', D.map(()=> 'M'), ()=>'color-mix(in srgb,var(--accent) 55%,var(--surface2))', ()=> 'Vorbereitung Wettkampf 24.01.');
  g += band('Meso', D.map(d=> d.W.phase==='Pause'?'Pause':d.W.block), v=> v==='Pause'?'var(--sunk)': v==='Block 1'?'color-mix(in srgb,var(--d-reck) 70%,var(--surface2))':'color-mix(in srgb,var(--d-barren) 70%,var(--surface2))', (v,f)=> v==='Pause'?(f?'Pause':'P'):v);
  g += band('Mikro', D.map(d=>d.W.phase), v=>PHASECOL[v]||'var(--sunk)', (v,f)=> f?v:(PHASEABBR[v]||v));
  if(mode!=='turn') g += band('Kraft', D.map(d=>(d.state&&d.state!=='—')?d.state:'–'), v=> v==='–'?'var(--sunk)':'color-mix(in srgb,var(--accent) '+({A:35,B:55,C:75}[v]||40)+'%,var(--surface2))', (v,f)=> v==='–'?'':(f?'Stand '+v:v));
  if(mode!=='gym') g += band('Rollen', D.map(d=>phaseIdx(d.w)), v=>'color-mix(in srgb,var(--d-hand) '+(35+v*20)+'%,var(--surface2))', (v,f)=> 'Wo '+['1–4','5–8','9–14'][v]);
  // Wochennummern + Tippflächen

  const Ht = by+14;
  g += D.map((d,k)=>`<rect x="${L+k*cwid}" y="0" width="${cwid}" height="${Ht}" fill="transparent" data-act="cycw" data-v="${d.w}" style="cursor:pointer"><title>Woche ${d.w}</title></rect>`).join('');
  const d = D[sel-1]; const W=d.W;
  const pl = mode==='turn'?d.tPlan:mode==='gym'?d.gPlan:d.tPlan+d.gPlan, dn = mode==='turn'?d.tDone:mode==='gym'?d.gDone:d.tDone+d.gDone;
  const h1 = v => fmt(Math.round(v*10)/10);
  return `<div class="card cyc">
    <div class="spread"><b>Zyklen</b><div class="seg">${[['turn','Turnen'],['gym','Gym'],['komb','Kombiniert']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-act="cyc" data-v="${k}">${l}</button>`).join('')}</div></div>
    <svg viewBox="0 0 ${Wd} ${Ht}" width="100%" role="img" aria-label="Belastung pro Woche mit Makro-, Meso- und Mikrozyklus">${g}</svg>
    <div class="legend">${mode!=='gym'?'<span><i style="--c:var(--d-hand)"></i>Turnen</span>':''}${mode!=='turn'?'<span><i style="--c:var(--accent)"></i>Gym</span>':''}<span><i style="--c:var(--line)"></i>hell = geplant, kräftig = gemacht</span><span>┄ Trend geplant · ─ Trend gemacht</span>${mode==='gym'?'<span><i style="--c:var(--warn)"></i>% 1RM schwerer Satz</span>':''}</div>
    <p class="small muted">${mode!=='turn'?'Gym-Stunden aus deinen gemessenen Einheiten in Woche 1 hochgerechnet. ':''}Woche antippen: darunter erscheint ihr Wochenplan.</p></div>`;
}

/* ----- Status ----- */
function logRows(){
  const rows=[];
  Object.entries(S.turn).forEach(([date,D])=>{ const T=PLAN.turnen[D.day]; if(!T) return;
    Object.entries(D.items||{}).forEach(([k,e])=>{ const it=T.items.find(i=>ikey(i)===k); if(!it||!(e.done>0)) return;
      rows.push({date, day:D.day, item:it, element:it.name, device:it.device, status:it.status, unit:it.unit, versuche:e.done, ok:graded(e)?okCount(e):(e.ok??null), hilfe:e.hilfe, note:e.note, notiz:e.notiz}); }); });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
function elementStats(name){
  const from = iso(addDays(today(),-14));
  const r = logRows().filter(x=>x.element===name && x.date>=from);
  const V=r.reduce((a,x)=>a+x.versuche,0), G=r.reduce((a,x)=>a+(x.ok||0),0);
  const ro=r.filter(x=>x.hilfe==='ohne'); const VO=ro.reduce((a,x)=>a+x.versuche,0), GO=ro.reduce((a,x)=>a+(x.ok||0),0);
  const notes=r.filter(x=>x.note); const avg = notes.length? notes.reduce((a,x)=>a+Number(x.note),0)/notes.length : null;
  const K=r.length; const QO = VO?GO/VO:null;
  let amp; if(K<3) amp=['n','zu wenig Daten']; else if(QO==null) amp=['r','rot (nur mit Hilfe)']; else if(QO>=.8) amp=['g','grün']; else if(QO>=.5) amp=['y','gelb']; else amp=['r','rot'];
  const U=r.filter(x=>x.status==='Versuch' && x.ok==null).reduce((a,x)=>a+x.versuche,0);
  return {V,G,U,Q:V?G/V:null,VO,GO,QO,K,avg,amp};
}
function elementItems(name){ return ['Mo','Di','Do'].map(d=>PLAN.turnen[d].items.find(i=>i.name===name)).filter(Boolean); }
function currentRole(name, w){ for(const it of elementItems(name)){ const r=roleOf(it,w); if(r) return r; } return null; }
function sessionBars(name){
  const r = logRows().filter(x=>x.element===name).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12); if(!r.length) return '';
  const W=300,H=66,T=4,B=16, bw=18; const max=Math.max(...r.map(x=>x.versuche),1); const ih=H-T-B;
  let g=''; r.forEach((x,k)=>{ const X=k*(bw+7); const ok=x.ok||0, unk=x.ok==null?x.versuche:0, no=Math.max(0,x.versuche-ok-unk);
    let y=T+ih; const seg=(v,c)=>{ if(v<=0) return ''; const h=v/max*ih; y-=h; return `<rect x="${X}" y="${(y+1).toFixed(1)}" width="${bw}" height="${Math.max(1,h-2).toFixed(1)}" rx="2" fill="${c}"/>`; };
    g+=seg(ok,'var(--ok)')+seg(no,'var(--bad)')+seg(unk,'var(--warn)');
    g+=`<text x="${X+bw/2}" y="${H-3}" text-anchor="middle">${x.date.slice(8,10)}.${x.date.slice(5,7)}</text>`;
    g+=`<rect class="hit" x="${X-3}" y="0" width="${bw+6}" height="${H}" data-tip="${dm(parse(x.date))} ${x.day}: ${x.ok==null?x.versuche+' Versuche, nicht bewertet':x.ok+' von '+x.versuche+' gelungen'}${x.hilfe?' · '+x.hilfe:''}${x.note?' · Note '+x.note:''}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Versuche pro Einheit" style="max-width:${r.length*25+10}px">${g}</svg>`;
}

/* ----- Kraft ----- */
function bestFromLog(c){
  const from = iso(addDays(today(),-14)); let best=null;
  PLAN.gym.forEach(g=>{ if(gDate(g)<from) return; g.items.forEach(it=>{ if(!exKey(it.name).startsWith(c.name)) return;
    (S.gym[g.id]?.items?.[it.nr]?.sets||[]).forEach(s=>{ if(!s.done||s.kg===''||!s.reps||s.rir===''||s.rir==null) return; const r={nr:c.nr,kg:Number(s.kg),reps:Number(s.reps),rir:Number(s.rir)}; const v=e1(r); if(!best||v>best.v) best={...r,v,date:gDate(g)}; }); }); });
  return best;
}

function overridesList(){

    out.push({txt:`Soll · ${day} · ${it.name}: ${ws.map(w=>`Wo ${w} = ${o[w]} (Plan ${it.w[w-1]})`).join(', ')}`, act:'goalreset', a:{ik:k, day}}); });

  Object.entries(S.ovr.sets).forEach(([k,n])=>{ const [gid,nr]=k.split(':'); const g=PLAN.gym.find(x=>x.id===gid); const it=g?.items.find(i=>i.nr==nr); if(it) out.push({txt:`Sätze · ${exKey(it.name)} (${gid}): ${n} statt ${it.sets}`, act:'setsreset', a:{key:k}}); });
