<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Trainingsplan Wo 1–14</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout: gym-logger look — near-black surfaces, one fire-orange accent, big numbers; one 550.5px column, sticky week header + apparatus bar, tab bar at the thumb. Dark-first. */
:root{
  --bg:#25282b; --head:#1c1f22; --surface:#2f3336; --surface2:#363a3e; --sunk:#41464b; --ink:#eceff1; --muted:#9aa1a8; --line:#3b4045;
  --accent:#12a4e6; --accent2:#0b8cc6; --accent-ink:#ffffff; --soft:#1e3a4a; --fire:#12a4e6;
  --try:#f0a63a; --try-soft:#3d3222; --ok:#3ccf7e; --ok-soft:#21392c; --warn:#f2c14e; --warn-soft:#3d3522; --bad:#ff6b6b; --bad-soft:#442a2c;
  --d-boden:#2bbd88; --d-sprung:#e0a21a; --d-reck:#5aa0f0; --d-pferd:#e0709a; --d-hand:#3fb83f; --d-barren:#a497ef; --d-ringe:#ef7b7b; --d-warm:#8592a2; --d-kond:#9aa6b4;
  --f-display:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8.5px; --tabh:55px; --toph:103px;
  color-scheme:dark;
}


:root[data-theme="light"]{
  --bg:#eef0f2; --head:#ffffff; --surface:#ffffff; --surface2:#f4f5f7; --sunk:#e3e6ea; --ink:#1d2023; --muted:#5f666d; --line:#dde1e5;
  --accent:#0a8fd0; --accent2:#0878b0; --accent-ink:#ffffff; --soft:#e2f2fb; --fire:#0a8fd0;
  --try:#a8660a; --try-soft:#fdf0dc; --ok:#15924d; --ok-soft:#e1f4e9; --warn:#946600; --warn-soft:#fbf0d2; --bad:#c83434; --bad-soft:#fbe3e3;
  --d-boden:#1baf7a; --d-sprung:#c98500; --d-reck:#2a78d6; --d-pferd:#d55181; --d-hand:#008300; --d-barren:#6250d6; --d-ringe:#e34948; --d-warm:#7d8999; --d-kond:#66727f;
  color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wrap{max-width:550.5px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:8.5px 7.5px;display:flex;flex-direction:column;gap:7.5px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:3.5px 10.5px;flex-wrap:wrap}
.wk{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1;text-transform:uppercase;letter-spacing:.06em}
.wk small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:7px;white-space:nowrap;text-transform:none;letter-spacing:0}
.phase{font-family:var(--f-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);white-space:nowrap}
.days{display:grid;grid-template-columns:20.5px repeat(7,1fr) 20.5px;gap:4.5px;align-items:stretch}
.days .arrow{border:0;background:none;color:var(--muted);font-size:20.5px;padding:0}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10.5px;padding:4.5px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day b{font-family:var(--f-display);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day span{font-family:var(--f-display);font-size:15.5px;font-weight:400;line-height:1}
.day i{font-style:normal;font-size:8.5px;letter-spacing:.06em;color:var(--muted);height:10.5px;font-family:var(--f-display);font-weight:600}
.day .dd{display:flex;gap:2px;height:4.5px}
.day .dd em{width:4.5px;height:4.5px;border-radius:50%}
.day.today{border-color:var(--accent)}
.day.today span{color:var(--accent)}
.day.sel{background:var(--fire);border-color:transparent;color:var(--accent-ink)}
.day.sel b,.day.sel i,.day.sel span{color:var(--accent-ink)}
.day.sel .dd em{box-shadow:0 0 0 1px var(--accent-ink)}
.day.free span{opacity:.45}

main{padding-block:14px calc(var(--tabh) + 82.5px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:10.5px}
h2{font-family:var(--f-display);font-weight:400;font-size:20.5px;margin:0;line-height:1.15;text-wrap:balance;text-transform:uppercase;letter-spacing:.05em}
.center-h{text-align:center}
h3{font-family:var(--f-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10.5px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:10.5px;padding:8.5px 10.5px;font-size:12px}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.ok{background:var(--ok-soft);border-color:transparent}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾";color:var(--muted)}
details[open]>summary::after{content:" ▴"}
details.rule{font-size:11px;color:var(--muted)}
details.rule>summary{font-weight:600;color:var(--muted)}
details.rule p{margin-top:3.5px}

.units{display:flex;gap:5px;overflow-x:auto;padding:2.5px;background:var(--surface);border:1px solid var(--line);border-radius:859px}
.unit{flex:1 0 auto;border:0;background:transparent;border-radius:859px;padding:8.5px 12px;font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.unit.on{background:var(--fire);color:var(--accent-ink)}
.unit .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}

.sessionhead{display:flex;flex-direction:column;gap:8.5px}
.sessionhead h2{font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:3.5px 12px;font-size:12px;color:var(--muted)}
.meta strong{color:var(--ink);font-family:var(--f-display);font-size:15.5px;font-weight:700}
.progress{height:5px;border-radius:2.5px;background:var(--sunk);overflow:hidden}
.progress>div{height:100%;background:var(--fire);border-radius:2.5px;transition:width .25s}
.btn{border:0;background:var(--surface2);color:var(--accent);border-radius:859px;padding:8.5px 14px;font-weight:500;font-size:13px;letter-spacing:.03em}
.btn.primary{background:var(--fire);color:var(--accent-ink);border-color:transparent}
.btn.big{padding:13px 15.5px;font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;flex:1}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 9.5px;font-size:12px;border-radius:8.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:var(--surface2);color:var(--accent);border-radius:859px;width:44.5px;font-size:19px;font-weight:700;line-height:1;flex:none}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8.5px}
.panel{border-top:1px solid var(--line);padding-top:10.5px;display:flex;flex-direction:column;gap:8.5px}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10.5px;overflow:hidden}
.menu button{border:0;border-bottom:1px solid var(--line);background:var(--surface2);text-align:left;padding:10.5px 12px;font-weight:700}
.menu button:last-child{border-bottom:0}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:11px}

.compo{display:flex;gap:2px;height:7px;border-radius:3.5px;overflow:hidden}
.compo span{display:block;height:100%;min-width:2.5px}
.devnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph));z-index:15;background:var(--bg);padding-block:7px;margin-block:-4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.devnav::-webkit-scrollbar{display:none}
.dchip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10.5px;padding:6px 9.5px 6px 6px;text-align:left;position:relative;overflow:hidden}
.dchip .ic{width:26px;height:26px;border-radius:7.5px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc) 22%,transparent);color:var(--dc);flex:none}
.dchip .ic svg{width:16.5px;height:16.5px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dchip .tx{display:flex;flex-direction:column;line-height:1.1}
.dchip .tx b{font-family:var(--f-display);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.dchip .tx small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dchip .pb{position:absolute;left:0;bottom:0;height:2.5px;background:var(--dc)}
.dchip.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,var(--surface))}
.dchip.all{--dc:var(--accent)}
.dchip.all .ic{background:var(--sunk);color:var(--ink)}
.dchip.fin .tx small{color:var(--ok);font-weight:700}
.dhead{display:flex;align-items:center;gap:10.5px;margin-top:10.5px;padding:3.5px 2px}
.dhead .ic{width:31px;height:31px;border-radius:8.5px;display:grid;place-items:center;background:color-mix(in srgb,var(--dc) 22%,transparent);color:var(--dc);flex:none}
.dhead .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dhead .t{flex:1;min-width:0}
.dhead .t b{font-family:var(--f-display);font-size:17px;font-weight:400;letter-spacing:.06em;line-height:1;display:block;text-transform:uppercase;letter-spacing:.02em}
.dhead .t small{font-size:11px;color:var(--muted)}
.dhead .r{text-align:right;font-family:var(--f-display);font-size:12px;color:var(--muted);line-height:1.15}
.dhead .r b{font-size:19px;color:var(--ink)}
.subsec{font-family:var(--f-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:2px 0 -4px 3.5px}
.devpager{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:5px}
.devpager .btn{display:flex;align-items:center;gap:7px;justify-content:center}
.devpager .btn i{width:8.5px;height:8.5px;border-radius:50%;background:var(--dc);display:inline-block}

/* exercise card */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10.5px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:0 2.5px 2.5px 0;background:var(--dc,var(--line))}
.item.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item.compact{flex-direction:row;align-items:center;padding:10px 12px 10px 14px;gap:10.5px;text-align:left;width:100%;justify-content:flex-start;background:var(--surface);border-color:transparent}
.item.compact::before{top:10.5px;bottom:10.5px}
.item.compact .ck{width:20.5px;height:20.5px;border-radius:50%;border:2px solid var(--sunk);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;color:#1c1f22}
.item.compact .ck.fin{background:var(--ok);border-color:var(--ok)}
.item.compact .ck.next{border-color:var(--accent)}
.item.compact .nm{flex:1;min-width:0;color:var(--accent);font-weight:400;font-size:15px;line-height:1.25;text-align:left}
.item.compact .nm small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.item.compact .nm small b{color:var(--accent);font-weight:500}
.item.compact .vl{display:flex;align-items:baseline;gap:2px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end;max-width:79px}
.item.compact .vl b{font-size:18px;font-weight:400;color:var(--ink)}
.item.compact .vl b.ok{color:var(--ok)}
.item.compact .vl b.over{color:var(--accent)}
.item.compact .vl span{font-size:13px;color:var(--muted)}
.item.compact .vl small{flex-basis:100%;text-align:right;font-size:9.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:14px;flex:none;padding-left:3.5px}
.item.open{border-color:var(--line)}
.item.open .ihead{cursor:pointer}
.item.open .iname{color:var(--accent);font-weight:400;font-size:16.5px}
.ihead{display:flex;gap:10.5px;align-items:flex-start}
.ihead .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3.5px}
.iname{font-weight:500;font-size:14.5px;line-height:1.25}
.isub{font-size:11px;color:var(--muted)}
.itags{display:flex;flex-wrap:wrap;gap:4.5px;align-items:center}
.tag{font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:859px;background:var(--sunk);color:var(--muted)}
.tag.try{background:var(--try-soft);color:var(--try)}
.tag.S{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.U{background:var(--sunk);color:var(--ink)}
.tag.K{background:var(--sunk);color:var(--ink)}
.tag.ovr{background:var(--warn-soft);color:var(--warn)}
.tag.now{background:var(--fire);color:var(--accent-ink)}
.tag.extra{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.goal{text-align:right;flex:none}
.goal .n{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:.95;color:var(--ink)}
.goal .u{font-size:10.5px;color:var(--muted)}
.more{border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;padding:2px 0;text-align:left;align-self:flex-start}

/* unified counter: − value + */
.stepper{display:grid;grid-template-columns:48px 1fr 62px;gap:8.5px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:5px}
.stepper .minus{height:44.5px;border-radius:10.5px;border:0;background:var(--sunk);font-size:22.5px;font-weight:700;color:var(--muted)}
.stepper .plus{height:51.5px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;font-weight:500;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 15.5px -8px var(--accent)}
.stepper .plus small{font-family:var(--f-body);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.stepper .val{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.stepper .val b{font-family:var(--f-display);font-size:31px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--accent)}
.stepper .val b small{font-size:17px;color:var(--muted);font-weight:600}
.stepper .val span{font-size:10.5px;color:var(--muted);margin-top:2.5px}
.stepper .val .xtra{font-style:normal;color:var(--accent);font-weight:500}
th.n{font-size:9.5px;font-family:var(--f-body)}
td:first-child{white-space:nowrap}
.stepper.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.stepper.done .val b{color:var(--ok)}
.stepper.over .val b{color:var(--accent)}
.mbar{height:3.5px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.mbar>div{height:100%;background:var(--fire)}
.mbar.done>div{background:var(--ok)}
.attempts{display:grid;grid-template-columns:1fr 1fr 44.5px;gap:7px}
.abtn{height:48px;border-radius:859px;border:0;font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px}
.abtn.yes{background:var(--fire);color:var(--accent-ink);box-shadow:0 5px 15.5px -8px var(--accent)}
.abtn.no{background:var(--sunk);color:var(--ink)}
.abtn.undo{background:var(--surface2);border:1px solid var(--line);font-size:17px;color:var(--muted)}
.seq{display:flex;flex-wrap:wrap;gap:4.5px;align-items:center;min-height:19px}
.seq span,.seq button{width:22.5px;height:22.5px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:0;padding:0}
.seq .q{background:var(--warn-soft);color:var(--warn)}
.seq .y{background:var(--ok);color:#1c1f22}
.seq .x{background:var(--bad-soft);color:var(--bad)}
.seq .e{border:1.5px dashed var(--line)}
.ladder{display:flex;flex-direction:column;gap:3.5px;font-size:12px}
.ladder div{display:flex;align-items:center;gap:8.5px;color:var(--muted)}
.ladder div .ck{width:19px;height:19px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
.ladder div.on{color:var(--ink)}
.ladder div.on .ck{background:var(--ok);border:0;color:#1c1f22}
.ladder div.next{color:var(--ink);font-weight:700}
.ladder div.next .ck{border-color:var(--accent);color:var(--accent)}
.seg.pills{border:0;background:transparent;gap:8.5px}
.seg.pills button{border-radius:859px;background:var(--surface);padding:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.seg.pills button+button{border-left:0}
.seg.pills button.on{background:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8.5px;overflow:hidden;flex-wrap:nowrap;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 9.5px;font-weight:700;font-size:12px;min-width:31px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fire);color:var(--accent-ink)}
.seg.full{display:flex}
.seg.full button{flex:1}
.lbl{font-size:11px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:3.5px}
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--surface2);border:1px solid var(--line);border-radius:8.5px;padding:8.5px;width:100%;min-width:0}
select{width:auto;padding:7px 8.5px;font-weight:700;font-size:12px}
textarea{resize:vertical;min-height:60px}
.stages{display:flex;flex-direction:column;gap:7px}
.stage{display:grid;grid-template-columns:1fr auto;gap:3.5px 8.5px;align-items:center;padding-top:7px;border-top:1px solid var(--line)}
.stage:first-child{border-top:0;padding-top:0}
.stage .d{font-size:12px;color:var(--muted);grid-column:1}
.formq{display:grid;grid-template-columns:65.5px 1fr;gap:7px;align-items:center}
.intro{display:flex;flex-direction:column;gap:7px;border-color:var(--accent)}
.intro ol{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:3.5px;font-size:13px}

/* gym set table */
.sets{display:flex;flex-direction:column;gap:5px}
.sethead,.set{display:grid;grid-template-columns:17px 43px 1.35fr 1fr 1fr 39.5px;gap:4.5px;align-items:center}
.sethead{font-family:var(--f-display);font-size:9.5px;color:var(--muted);font-weight:500;text-align:center;text-transform:uppercase;letter-spacing:.12em}

.hint{font-size:12px;color:var(--muted)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-display);font-size:10.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .plan{fill:var(--sunk)}
.chart .done{fill:var(--accent)}
.chart text.cur{fill:var(--ink);font-weight:700}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .step{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10.5px;height:10.5px;border-radius:2.5px;display:inline-block;background:var(--c)}
.legend i.dash{height:0;border-top:2px dashed var(--muted);border-radius:0;background:none}
.readout{font-size:12px;min-height:17px}
.mult{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10.5px}
.mult>div{min-width:0}
#tip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);font-size:11px;padding:5px 7.5px;border-radius:7px;pointer-events:none;max-width:206.5px;line-height:1.3}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface2);border-top:1px solid var(--line);color:var(--ink)}

.timer .l{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.timer button{background:var(--sunk);border:0;color:inherit;border-radius:8.5px;padding:7px 9.5px;font-weight:700}
.timer.over{background:var(--ok);color:#1c1f22}
.timer.over .t,.timer.over .l{color:#1c1f22}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--head);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;color:var(--muted);font-size:8.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}

.wrow{display:grid;grid-template-columns:38px 1fr auto;gap:8.5px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9.5px 11px;text-align:left;width:100%}

.bar{display:block;height:3.5px;border-radius:2px;background:var(--sunk);margin-top:3.5px}

<body>
<header class="top" id="topwrap"><div class="wrap" id="top"></div></header>
<main><div class="wrap stack" id="view"></div></main>
<div class="timer" id="timer" hidden><div class="wrap">
  <div class="t" id="timerT">0:00</div><div class="l" id="timerL">Pause</div>
  <button type="button" id="timerPlus">+30 s</button><button type="button" id="timerStop">Fertig</button>
</div></div>
<nav class="tabs" aria-label="Bereiche"><div class="wrap" id="tabs"></div></nav>
<div class="toast" id="toast" hidden><span id="toastT"></span><button type="button" id="toastUndo" hidden>Rückgängig</button></div>
<div id="tip" hidden></div>

<script>
const PLAN_KEY='trainingsplan.plan', TPL_KEY='trainingsplan.tpl';
/* Liest die Trainingsplan-Excel (ExcelJS-Workbook) und erzeugt das PLAN-Objekt der App.
   Läuft im Browser (Plan aktualisieren) und in Node (Build). */
function extractPlan(wb){
  const WS = n => { const w=wb.getWorksheet(n); if(!w) throw new Error('Blatt „'+n+'“ fehlt'); return w; };
  const raw = (ws,r,c) => ws.getCell(r,c).value;
  const V = (ws,r,c) => { let v=raw(ws,r,c); if(v==null) return null;
    if(typeof v==='object' && !(v instanceof Date)){
      if('result' in v || 'formula' in v || 'sharedFormula' in v){ v=v.result; if(v==null) return null; if(typeof v==='object' && v.error) return null; }
      else if(v.richText) return v.richText.map(t=>t.text).join('');
      else if('text' in v) return v.text;
      else if(v.error) return null; }
    return v; };
  const F = (ws,r,c) => { const cell=ws.getCell(r,c); const f=cell.formula; return f ? '='+f : null; };
  const pad=n=>String(n).padStart(2,'0');
  const iso = d => (d instanceof Date) ? `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}` : null;
  const num = v => (typeof v==='number') ? Math.round(v*1e4)/1e4 : v;
  const str = v => v==null ? '' : (typeof v==='number' && Number.isInteger(v) ? String(v) : String(v));
  const isInt = v => typeof v==='number' && Number.isInteger(v);
  const maxRow = ws => ws.rowCount;

  const ov=WS('Übersicht'), lt=WS('Gym LT');
  const plan = {title:V(ov,1,1), subtitle:V(ov,2,1), start:'2026-10-19', bodyweight:V(WS('Calc'),3,3)};
  plan.weeks=[];
  for(let i=0;i<14;i++){ const r=5+i, g=5+i;
    plan.weeks.push({wo:V(ov,r,1), range:V(ov,r,2), block:V(ov,r,3), abende:V(ov,r,4),
      turnMin:{Mo:num(V(ov,r,5))??0, Di:num(V(ov,r,6))??0, Do:num(V(ov,r,7))??0}, phase:V(ov,r,9), gymTage:V(ov,r,10), note:V(ov,r,11),
      lt:{code:V(lt,g,2), start:iso(V(lt,g,3)), end:iso(V(lt,g,4)), wdhSchwer:V(lt,g,7), rirZiel:V(lt,g,8), rir:num(V(lt,g,9)),
          pctHeavy:num(V(lt,g,10)), leicht:V(lt,g,11), wdhLeicht:V(lt,g,12), pctLight:num(V(lt,g,13)), assist:V(lt,g,14), state:V(lt,g,15), kommentar:V(lt,g,22)}}); }
  plan.assumptions=[]; for(let r=21;r<27;r++){ const v=V(ov,r,1); if(v) plan.assumptions.push(v); }
  plan.gymLtNotes=[]; for(let r=21;r<25;r++){ const v=V(lt,r,1); if(v) plan.gymLtNotes.push(v); }

  // ---- Turnen
  plan.turnen={};
  for(const day of ['Mo','Di','Do']){ const s=WS('Turnen '+day);
    const d={title:V(s,1,1), focus:V(s,2,1), why:V(s,3,1), roleInfo:V(s,4,1), dates:[...Array(14)].map((_,k)=>iso(V(s,6,7+k))), items:[], notes:[], blocks:[], time:{}};
    let block=null;
    for(let r=7;r<=maxRow(s);r++){ const a=V(s,r,1), b=V(s,r,2), dcol=V(s,r,4), f=V(s,r,6);
      if(!a && typeof dcol==='string' && dcol.trim().startsWith('▸') && f==='Block'){ block={label:dcol.trim().replace(/^▸\s*/,''), section:b, min:[...Array(14)].map((_,k)=>num(V(s,r,7+k))||0)}; d.blocks.push(block); continue; }
      if(!a && typeof dcol==='string' && dcol.trim().startsWith('↳') && d.items.length){ d.items[d.items.length-1].sets=[...Array(14)].map((_,k)=>{ const v=V(s,r,7+k); return (v==null||v==='')?'':str(v); }); continue; }
      if(isInt(a) && dcol){ const name=dcol;
        const prio=[...Array(14)].map((_,k)=>{ const v=V(s,r,31+k); return (v==='M'||v==='K')?v:null; });
        const item={nr:a, section:b, device:V(s,r,3), name, status:V(s,r,5), unit:V(s,r,6), w:[...Array(14)].map((_,k)=>num(V(s,r,7+k))||0),
          sec:num(V(s,r,21))||0, id:V(s,r,22), roles:String(V(s,r,23)||'–·–·–').split('·').map(x=>x.trim()), setSize:num(V(s,r,26)), row:r};
        if(prio.some(Boolean)) item.prio=prio.map(x=>x||'M');
        if(block) item.block=block.label;
        if(name.startsWith('Bodenbahnen')) item.program='boden';
        if(name.startsWith('Handstand-Programm')) item.program='hand';
        if(name.startsWith('Landungen vom Sprungbrett')) item.landing=true;
        d.items.push(item); continue; }
      { const lab = !a ? [dcol,b].find(x=>typeof x==='string' && /^(Zeit Muss, echt|Kann zusätzlich|Übungszeit Muss)/.test(x.trim())) : null;
        if(lab){ const vals=[...Array(14)].map((_,k)=>num(V(s,r,7+k))); const t=lab.trim(); if(/^Zeit Muss, echt/.test(t)) d.time.muss=vals; else if(/^Kann zusätzlich/.test(t)) d.time.kann=vals; else d.time.uebung=vals; continue; } }
      if(a && typeof a==='string' && r>60 && a.length>30) d.notes.push(a); }
    if(!d.blocks.length) delete d.blocks; if(!Object.keys(d.time).length) delete d.time;
    plan.turnen[day]=d; }

  // ---- Bodenbahnen
  { const s=WS('Bodenbahnen'); const bb={intro:[V(s,1,1),V(s,2,1),V(s,3,1)], programs:{}, schedule:{}, notes:[]};
    const txt=r=>String(V(s,r,1)||''); let plan_r0=null; for(let r=1;r<=maxRow(s);r++){ if(txt(r).startsWith('Landungs-Leiter')||txt(r).startsWith('Plan: welches')){ plan_r0=r; break; } }
    let cur=null;
    for(let r=6;r<plan_r0;r++){ const a=V(s,r,1);
      if(a && V(s,r,2)==null && String(a).includes('·')){ cur=String(a).split('·')[0].trim(); bb.programs[cur]={name:a, lanes:[]}; }
      else if(a && V(s,r,2)) bb.programs[cur].lanes.push({row:r, bahn:V(s,r,2), name:V(s,r,3), stages:[V(s,r,4),V(s,r,5),V(s,r,6)], stufe:V(s,r,7)||1, hint:V(s,r,8)}); }
    let plan_r=null, lad_r=null; for(let r=1;r<=maxRow(s);r++){ const t=txt(r); if(plan_r==null && t.startsWith('Plan: welches Programm')) plan_r=r; if(lad_r==null && t.startsWith('Landungs-Leiter')) lad_r=r; }
    for(let r=plan_r+2;r<plan_r+16;r++){ if(isInt(V(s,r,1))) bb.schedule[V(s,r,1)]={Mo:V(s,r,3), Di:V(s,r,4), Do:V(s,r,5)}; }
    for(let r=plan_r+16;r<=maxRow(s);r++){ const v=V(s,r,1); if(v) bb.notes.push(v); }
    bb.ladder={title: lad_r?V(s,lad_r,1):'', items:[], note:''};
    if(lad_r){ let r=lad_r+2; while(isInt(V(s,r,1))){ bb.ladder.items.push({nr:V(s,r,1), name:V(s,r,3), rule:V(s,r,4), doOk:V(s,r,5)==='ja', hint:V(s,r,8)}); r++; } bb.ladder.note=V(s,r,1)||''; }
    plan.bodenbahnen=bb; }

  // ---- Handstand
  { const s=WS('Handstand'); const hs={intro:[V(s,1,1),V(s,2,1),V(s,3,1)], exercises:[], programs:{}, schedule:{}, notes:[]};
    for(let r=6;r<16;r++){ if(V(s,r,2)) hs.exercises.push({row:r, name:V(s,r,2), stages:[V(s,r,3),V(s,r,4),V(s,r,5)], stufe:V(s,r,6)||1, hint:V(s,r,7), marks:Object.fromEntries([0,1,2,3].map(k=>['H'+(k+1), V(s,r,8+k)]))}); }
    for(let r=18;r<22;r++){ const v=V(s,r,2); if(v) hs.programs[String(v).split('·')[0].trim()]=v; }
    for(let r=25;r<39;r++){ if(isInt(V(s,r,1))) hs.schedule[V(s,r,1)]={Mo:V(s,r,2), Di:V(s,r,3), Do:V(s,r,4)}; }
    for(let r=40;r<43;r++){ const v=V(s,r,2); if(v) hs.notes.push(v); }
    plan.handstand=hs; }

  // ---- Calc
  const calcByRow={};
  { const s=WS('Calc'); plan.calc=[];
    for(let r=7;r<27;r++){ if(!isInt(V(s,r,1))) continue;
      const st=c0=>{ const kg=V(s,r,c0); if(kg==null||kg==='') return null; return {kg, reps:V(s,r,c0+1), rir:V(s,r,c0+2)}; };
      plan.calc.push({nr:V(s,r,1), row:r, name:V(s,r,2), unit:V(s,r,3), kgCounts:V(s,r,4)==='Ja', A:st(5), B:st(9), C:st(13)}); calcByRow[r]=V(s,r,1); }
    plan.calcNotes=[]; for(let r=28;r<32;r++){ const v=V(s,r,1); if(v) plan.calcNotes.push(v); } }

  // ---- Gym Plan
  { const s=WS('Gym Plan'); const sessions=[]; let cur=null; const weekHeader={}; const colstate={Q:'A',R:'B',S:'C'};
    for(let r=5;r<=maxRow(s);r++){ const a=V(s,r,1), f=V(s,r,6), c=V(s,r,3);
      if(a && !c && typeof f==='string' && f.startsWith('Woche')){ weekHeader[a]=f; continue; }
      if(!a && f && V(s,r,18)){ cur={header:f, code:null, date:null, day:null, items:[]}; sessions.push(cur); continue; }
      if(a && c && cur){ cur.code=a; cur.date=iso(c); cur.day=V(s,r,4); cur.phase=V(s,r,2);
        const fl=F(s,r,12); let target={value:V(s,r,12)};
        if(typeof fl==='string'){ let m=fl.match(/^='Gym LT'!([PQRSTU])(\d+)/);
          if(m){ const col=m[1]; target={type:'lt', lift:{P:'bp',S:'bp',Q:'bank',T:'bank',R:'lat',U:'lat'}[col], kind:'PQR'.includes(col)?'heavy':'light', week:Number(m[2])-4, value:V(s,r,12)}; }
          m=fl.match(/^=IF\(Calc!\$([QRS])\$(\d+)="","testen",MAX\(0,ROUND\(\(Calc!\$[QRS]\$\d+\/\(1\+\(([\d.]+)\+([\d.]+)\)\/30\)(-Calc!\$C\$3)?\)/);
          if(m) target={type:'calc', state:colstate[m[1]], calc:calcByRow[Number(m[2])], k:Number(m[3])+Number(m[4]), kg:!!m[5], value:V(s,r,12)}; }
        cur.items.push({row:r, nr:V(s,r,5), name:f, alt:V(s,r,7), sets:V(s,r,8), reps:V(s,r,9)!=null?str(V(s,r,9)):'', rir:V(s,r,10)!=null?str(V(s,r,10)):'',
          pause:V(s,r,11), target, hint:V(s,r,15), muscles:[V(s,r,19),V(s,r,20),V(s,r,21)].filter(Boolean),
          logged:{kg:V(s,r,13), reps:V(s,r,14), note:V(s,r,16)}}); } }
    const ltf=WS('Gym LT'); plan.ltLiftCalc={};
    for(const [col,lift] of [['P','bp'],['Q','bank'],['R','lat']]){ const fl=F(ltf,5,col.charCodeAt(0)-64)||''; const m=fl.match(/Calc!\$Q\$(\d+)/); plan.ltLiftCalc[lift]=m?calcByRow[Number(m[1])]:null; }
    plan.ltStates=[]; for(let i=0;i<14;i++){ const fl=F(ltf,5+i,16)||''; const m=String(fl).match(/Calc!\$([QRS])\$/); plan.ltStates.push(m?colstate[m[1]]:null); }
    sessions.forEach(se=>{ se.id=`${se.code}-${se.day}`; });
    plan.gym=sessions.filter(x=>x.items.length); plan.gymWeekHeaders=weekHeader; }

  // ---- Turn-Log
  { const s=WS('Turn-Log'); const log=[];
    for(let r=6;r<=maxRow(s);r++){ if(V(s,r,1) && V(s,r,3)) log.push({date:iso(V(s,r,1)), abend:V(s,r,2), element:V(s,r,3), hilfe:V(s,r,4), versuche:V(s,r,5), gelungen:V(s,r,6), note:V(s,r,7), notiz:V(s,r,8)}); }
    plan.turnLog=log; plan.turnLogInfo=[V(s,2,1),V(s,3,1)];
    let opts=null; try{ const m=s.dataValidations?.model||{}; for(const [k,dv] of Object.entries(m)){ if(/^D/.test(k) && dv?.formulae?.[0]){ opts=String(dv.formulae[0]).replace(/^"|"$/g,'').split(','); break; } } }catch(e){}
    plan.hilfeOptions=opts||['Partner','Weichboden','Trampolin','Doppelmini','Matte','ohne']; }

  // ---- Status
  { const s=WS('Status'); plan.status=[]; for(let r=6;r<19;r++){ if(V(s,r,2)) plan.status.push({row:r, device:V(s,r,1), element:V(s,r,2), lernstufe:V(s,r,4)}); }

lieren. Danach Stand B in Calc.","W06":"Woche 6: 23.11. – 29.11.2026 · Parallel zur Turn-Entlastung (80 %). Volumen ca. −40–50 %, Last bleibt (Praxis).","W07":"Woche 7: 30.11. – 06.12.2026 · Kraft-Block: 5er schwer, 6er leicht, normale Ausführung. Assistenz-Grundübungen 5–7 Wdh.","W08":"Woche 8: 07.12. – 13.12.2026 · ","W09":"Woche 9: 14.12. – 20.12.2026 · Schwerste Woche, danach Pause. Nie bis Versagen bei Dips und Schulterdrücken. Danach Stand C in Calc.","W10":"Woche 10: 21.12. – 27.12.2026 · Nur Turnen Mo 21.12. Ab Di 22.12. trainingsfrei.","W11":"Woche 11: 28.12. – 03.01.2027 · Trainingsfrei.","W12":"Woche 12: 04.01. – 10.01.2027 · Eine kurze Erhalt-Einheit am Mi 06.01. Lit.: 1 Einheit/Woche bei gleicher Intensität hält die Kraft (Spiering et al. 2021).","W13":"Woche 13: 11.01. – 17.01.2027 · Normale Woche, die Pause war die Entlastung. Do (C) bei RIR 3, weil abends Reck/Barren (Praxis).","W14":"Woche 14: 18.01. – 24.01.2027 · Wettkampfwoche (So 24.01., Annahme). Do und Fr kein Gym. Volumen runter, Intensität halten (Lit.: Bosquet et al. 2007)."},"turnLog":[{"date":"2026-10-19","abend":"Mo","element":"Strecksalto vw 1/1 Drehung (Lehrweg)","hilfe":null,"versuche":6,"gelungen":null,"note":null,"notiz":"Mit anderen trainiert, mehr als geplant. gelungen/Note fehlen."},{"date":"2026-10-19","abend":"Mo","element":"Überkehren (Flugteil; Weichboden, Partner)","hilfe":null,"versuche":5,"gelungen":0,"note":2,"notiz":null},{"date":"2026-10-19","abend":"Mo","element":"Kippe in Handstand (Matte, Partner)","hilfe":null,"versuche":3,"gelungen":1,"note":3,"notiz":null},{"date":"2026-10-19","abend":"Mo","element":"Wanderflanke, saubere","hilfe":null,"versuche":2,"gelungen":1,"note":null,"notiz":null},{"date":"2026-10-21","abend":"Di","element":"Übergrätschen mit Fangen","hilfe":null,"versuche":2,"gelungen":2,"note":2,"notiz":"Winkelstütz-Position leicht unter die Holme gesunken · Di-Plan am Mi 21.10."},{"date":"2026-10-21","abend":"Di","element":"Wanderflanke, saubere","hilfe":null,"versuche":4,"gelungen":1,"note":4,"notiz":"Di-Plan am Mi 21.10."},{"date":"2026-10-21","abend":"Di","element":"Strecksalto vw 1/1 Drehung (Lehrweg)","hilfe":"Weichboden","versuche":2,"gelungen":0,"note":3,"notiz":"Di-Plan am Mi 21.10."},{"date":"2026-10-22","abend":"Do","element":"Kippe in Handstand (Matte, Partner)","hilfe":null,"versuche":7,"gelungen":0,"note":4,"notiz":"7 Versuche ≈ 21 min (gestoppt)"},{"date":"2026-10-22","abend":"Do","element":"Übergrätschen mit Fangen","hilfe":null,"versuche":2,"gelungen":2,"note":1,"notiz":null},{"date":"2026-10-22","abend":"Do","element":"Unterschwung in Verbindung mit Übergrätschen (mit und ohne Fangen)","hilfe":null,"versuche":3,"gelungen":1,"note":4,"notiz":null},{"date":"2026-10-22","abend":"Do","element":"Auswerfen in den Handstand (Reck)","hilfe":null,"versuche":4,"gelungen":null,"note":null,"notiz":"frei, zusätzlich"}],"turnLogInfo":["Eine Zeile pro Element und Abend. Element und Hilfe aus der Liste wählen. „gelungen“ vorher festlegen, z. B. auf den Füßen, ohne Sturz, Griff gefasst.","Beispiel: 19.10.26 · Mo · Überkehren · Weichboden · 8 Versuche · 3 gelungen · Note 2 (1 = beste) · „zu früh gelöst“"],"hilfeOptions":["Partner","Weichboden","Trampolin","Doppelmini","Matte","ohne"],"status":[{"row":6,"device":"Reck","element":"Kippe in Handstand (Matte, Partner)","lernstufe":"A"},{"row":7,"device":"Reck","element":"Überkehren (Flugteil; Weichboden, Partner)","lernstufe":"A"},{"row":8,"device":"Reck","element":"Salto-Abgang in Sicherung","lernstufe":"A"},{"row":9,"device":"Reck","element":"Riesenfelgen Drehungen rw","lernstufe":"A"},{"row":10,"device":"Reck","element":"Freie Felge","lernstufe":"A"},{"row":11,"device":"Boden","element":"Strecksalto vw 1/1 Drehung (Lehrweg)","lernstufe":"A"},{"row":12,"device":"Boden","element":"Spagat zu Schweizer (Übergang)","lernstufe":"A"},{"row":13,"device":"Barren","element":"Übergrätschen mit Fangen","lernstufe":"A"},{"row":14,"device":"Barren","element":"Unterschwung in Verbindung mit Übergrätschen (mit und ohne Fangen)","lernstufe":"A"},{"row":15,"device":"Pferd","element":"Wanderflanke, saubere","lernstufe":"A"},{"row":16,"device":"Handstand","element":"Japaner-Versuche","lernstufe":"A"},{"row":17,"device":"Ringe","element":"Handstand (Ringe)","lernstufe":"A"},{"row":18,"device":"Ringe","element":"Kreuzhang mit Gummiband (je 3 s)","lernstufe":"A"}],"statusNotes":["Lernstufe selbst eintragen: A = neu, nur mit Hilfe · B = klappt manchmal alleine · C = fast sicher, in Verbindung. Ampel = Praxis-Heuristik.","Ampel grün = in ≥ 3 Einheiten der letzten 14 Tage ≥ 80 % ohne Hilfe gelungen. Praxis-Heuristik, keine Studie.","Kür-Entscheid bis So 13.12.: Was dann nicht mindestens gelb/B ist, wird im Wettkampf durch ein bekanntes Element ersetzt und bleibt im Training.","Rollen wechseln: Ende Wo 4 und Wo 8 im Blatt Umfänge (Spalten Rolle P2/P3). Die Mengen in den Turn-Blättern passen sich automatisch an."],"rules":[{"nr":1,"text":"Turnen geht vor. Leidet das Turnen (müde Arme, Muskelkater am Turnabend), wird das Gym gekürzt, nie das Turnen.","src":"deine Vorgabe"},{"nr":2,"text":"Last erst steigern, wenn du die obere Wdh-Zahl im RIR-Bereich in allen Sätzen schaffst. Mit dem neuen Gewicht wieder unten im Bereich starten (doppelte Progression).","src":"Sarahs FAQ"},{"nr":3,"text":"Hauptübungen: schwerer Satz mit Ziel-RIR. Passt die Ziel-kg nicht zum RIR, gilt der RIR: Last anpassen, nicht den RIR.","src":"Sarahs FAQ"},{"nr":4,"text":"Zeitnot: 1. Aufwärmen straffen, 2. Pausen kürzen, 3. Kabel-Fliegende weg, 4. je 1 Satz Arme weg. Hauptübungen bleiben. Lieber Sätze halbieren als Übungen streichen.","src":"Sarahs FAQ, Gymnastics BC"},{"nr":5,"text":"Gym-Einheit > 120 min (inkl. Umziehen) in Woche 1 gemessen → Kabel-Fliegende dauerhaft raus.","src":"deine Vorgabe 2 h"},{"nr":6,"text":"Schmerz: gering und stabil oder abnehmend ist ok. Steigt er, zuerst Dips und Schulterdrücken reduzieren (Last, dann Tiefe/Sätze). Hält er an: Physio/Arzt.","src":"Sarahs FAQ"},{"nr":7,"text":"Schlechte Tagesform: Einheit auf den nächsten möglichen Tag schieben – aber nie direkt vor ein Turnen. Ist die Einheit leicht, nur die Hauptübungen machen.","src":"Sarahs FAQ"},{"nr":8,"text":"Zwei schlechte Einheiten in Folge: Schlaf, Essen, Stress prüfen und die nächste Woche wie eine Entlastungswoche fahren.","src":"Sarahs FAQ, ohne Coach"},{"nr":9,"text":"Verpasste Einheit: Hauptübungen der verpassten Einheit in die nächste Einheit nehmen, Assistenz weglassen. Mehr als eine verpasst: Woche wiederholen.","src":"Sarahs FAQ"},{"nr":10,"text":"Turnen, Versuche: nur mit Sicherung. Abbruch nach 2 Fehlversuchen in Folge oder bei Technikverlust. Zahl in der Tabelle = Obergrenze.","src":"Übergabe"},{"nr":11,"text":"Boden: immer vw vor rw, Schraube vw (Strecksalto 1/1) in jeder Boden-Einheit. Reck: 1–2 Runden Riesen, dann Technik (Überkehren, Salto, Drehungen). Barren: 2 Runden 3 × 3 Stützschwünge in den Handstand, dann Elemente; Kippen nur am Do (Handflächen).","src":"deine Vorgaben"},{"nr":12,"text":"Reihenfolge im Gerätblock: leicht → schwer und thematisch (z. B. Kippe → Kippe in den Handstand, Riesen → Umspringen → Drehungen → Überkehren). Vor einem neuen Element 2–3 Wiederholungen der einfacheren Vorstufe, dann das neue Element, solange du frisch bist. Vorstufen kurz halten. Schwerpunkt-Elemente (S/★) gebündelt üben. U-Elemente: wenige saubere Versuche, damit nichts verloren geht. K: konstant (Salto-Abgang = Kopfsache: regelmäßig, Sicherung schrittweise abbauen; Ringe-Kraft).","src":"Lit. (Porter & Magill 2010; Branscheidt et al. 2019) + Praxis"},{"nr":13,"text":"Check zu Beginn: die ersten 2 Versuche jedes Schwerpunkt-Elements mit Note 1–5 ins Turn-Log (Schulnote: 1 = gestanden, Haltung wie im Video · 3 = durchgeturnt, sichtbare Fehler · 5 = abgebrochen/Sturz). Sie zeigen, was seit dem letzten Mal hängen geblieben ist (die besten Versuche am Ende überschätzen den Lernstand).","src":"Lit. (Brady 2004) + Ableitung"},{"nr":14,"text":"Rollen prüfen Ende Wo 4 und Wo 8 im Blatt Status: Schwerpunkt-Element grün → auf –, nächstes U-Element auf S (Blatt Umfänge, Spalten Rolle P2/P3).","src":"Praxis"},{"nr":15,"text":"Partner da → Partner-Elemente vorziehen. Mehr oder weniger gemacht als geplant ist ok: ins Turn-Log eintragen, was du wirklich gemacht hast.","src":"Praxis"},{"nr":16,"text":"Tausch Turnen ↔ Gym (z. B. wenn Partner an einem anderen Tag da sind): Turnplan des Tages mitnehmen. Liegen dadurch zwei Turnabende direkt hintereinander, am zweiten den Barren weglassen, falls er am ersten dran war, und Gym C nur leicht (RIR 3). Schwimmen bleibt ≥ 6 h vom Gym weg.","src":"Praxis"},{"nr":17,"text":"Pferd: immer zuerst Kreisflanken, dann die Wanderflanke (technisch am schwersten, frisch), dann der Rest. Pilz vorerst raus. Mo Kreisflanken + Wanderflanke, Di volles Programm mit Wanderflanke zuerst (Scheren und Abgang nur hier), Do nur Kreisflanken (ab Wo 7 + ganze Übung).","src":"deine Vorgabe, v5 angepasst"},{"nr":18,"text":"Zeitbudget: Muss-Teil ca. 150 min pro Abend (Zeitmodell: Einturnen + Übungszeit × 1,5 + 5 min pro Position, Blatt Umfänge). Zeit knapp → zuerst Kann-Zeilen (grau) weglassen, dann Wiederholungen bekannter Elemente kürzen. Versuch-Elemente und Durchgänge bleiben.","src":"Messung Do 22.10. + Praxis"},{"nr":19,"text":"Mengen halten statt steigern (Deckel, Blatt Umfänge Spalte AR). Fortschritt kommt über die Stufe (A → B → C) und die Sicherung, nicht über mehr Wiederholungen. Am Check (Wo 4/8) einzeln anheben, wenn im Turnblatt noch „passt“ steht.","src":"Praxis (v5)"},{"nr":20,"text":"In der Halle nur Turnen: Beweglichkeit zu Hause (Mi abends, Blatt Zuhause), Schiffchen und Winkelstütz im Gym A/C.","src":"Praxis (v5)"},{"nr":21,"text":"Calc pflegen: in Wo 1 die getesteten Übungen eintragen, nach Wo 5 und Wo 9 je einen harten Satz pro Übung. Dann rechnen Gym LT und Gym Plan die neuen Ziel-kg.","src":"Sarahs Calc"}],"evidence":[{"nr":1,"text":"Hauptübungen 5–8 Wdh, RIR 1–3, Pause 3–4 min","src":"Lit.: Keßler 2020 (RPE 8–9, Pause > 2 min); Wahl & Ji 2022 (Maximalkraft 3–4 min)"},{"nr":2,"text":"≥ 5 Sätze pro Hauptübung/Woche reichen für Kraft; ≥ 10 Sätze/Muskel gelten für Hypertrophie","src":"Lit.: Keßler 2020; Gavanda & Isenmann 2021"},{"nr":3,"text":"≥ 6 h zwischen Schwimmen und Krafttraining","src":"Lit.: Robineau et al. 2016 (JSCR), Ausdauer vs. Kraft"},{"nr":4,"text":"Ausdauer stört Maximalkraft und Hypertrophie kaum, Schnellkraft nur in derselben Einheit","src":"Lit.: Schumann et al. 2022 (Sports Med), Metaanalyse"},{"nr":5,"text":"Ermüdung beim Üben verschlechtert das Lernen, auch am Folgetag","src":"Lit.: Branscheidt et al. 2019 (Laborstudie, Greifaufgabe, nicht Turnen)"},{"nr":6,"text":"Exzentrische Kraft wichtig für Halteelemente an den Ringen","src":"Lit.: Schärer et al. 2021 (Sports). Übertrag auf Kreuzhang = Ableitung"},{"nr":7,"text":"Taper 2 Wochen, Volumen −41–60 %, Intensität halten","src":"Lit.: Bosquet et al. 2007, Metaanalyse"},{"nr":8,"text":"Kraft bleibt mit 1 Einheit/Woche bei gleicher Intensität erhalten","src":"Lit.: Spiering et al. 2021"},{"nr":9,"text":"Eiweiß ca. 1,6 g/kg/Tag","src":"Lit.: Morton et al. 2018 (BJSM)"},{"nr":10,"text":"Männliche Turner haben oft zu wenig Energie und Kohlenhydrate","src":"Lit.: Kuhlman et al. 2024 (n = 14, College)"},{"nr":11,"text":"Ausgleich Drücken/Ziehen, Hüftstreckung, einbeinige Arbeit","src":"Gymnastics BC Manual 2020"},{"nr":12,"text":"Neue Elemente gebündelt, sichere Elemente gemischt üben; Vorteil des Mischens im Sport klein","src":"Lit.: Brady 2004; Czyż et al. 2024 (Metaanalysen); Porter & Magill 2010"},{"nr":13,"text":"Vorstellungstraining zusätzlich zum Training wirkt (d ≈ 0,43), ersetzt es aber nicht","src":"Lit.: Simonsmeier et al. 2021 (Metaanalyse)"},{"nr":14,"text":"Ampel „wettkampfreif“ (≥ 80 % ohne Hilfe, ≥ 3 Einheiten in 14 Tagen)","src":"Praxis-Heuristik, keine Studie"},{"nr":15,"text":"Abstände Gym ↔ Turnen in Stunden, welche Übung an welchem Tag, Entlastung Wo 6, Ziel-% aus RIR","s   if(!s.v || s.v<3){

    Object.values(o.turn).forEach(D=>{ const m=MIG[D.day]||{}; const n={};

function seed(s){

    const d = s.turn[e.date] ||= {day, items:{}};

function graded(e){ return !!(e?.seq && e.seq.some(x=>x!==null)); }
function ticksOf(e, plan){ if(!plan) return []; if(e?.setsDone && e.setsDone.length===plan.length) return e.setsDone.slice(); let left=e?.done||0; return plan.map(v=>{ if(left>=v){ left-=v; return true; } return false; }); }
/* ----- Zeit pro Übung: Zeit seit dem vorherigen Eintrag zählt für die Übung (max. 25 min je Abschnitt) ----- */
function segTimes(start, log){ const ev=(log||[]).slice().sort((a,b)=>a.t-b.t); let prev=start||null; const out={};
  ev.forEach(e=>{ if(prev!=null){ const d=Math.min((e.t-prev)/1000, 25*60); if(d>0) out[e.k]=(out[e.k]||0)+d; } prev=e.t; }); return out; }
function turnTimes(dIso){ const D=S.turn[dIso]; if(!D?.log?.length) return null; return segTimes(D.start, D.log); }
function gymTimes(gid){ const L=S.gym[gid]; if(!L?.log?.length) return null; return segTimes(L.start, L.log); }
function devActual(sess, g, tt){ if(!tt) return 0; let sec=0; Object.entries(tt).forEach(([k,v])=>{ if(k.startsWith('prog:')){ if(g==='Einturnen') sec+=v; return; } const i=sess.T.items.find(x=>ikey(x)===k); if(i && grpOf(i)===g) sec+=v; }); return sec; }
const mmss = sec => { sec=Math.round(sec); return sec>=3600 ? Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+' h' : Math.floor(sec/60)+':'+pad(sec%60); };
const minTxt = sec => Math.round(sec/60)+' min';
function devTimeTag(planMin, actSec){ if(!actSec) return ''; const am=actSec/60; const diff=Math.round(am-planMin); const cls = !planMin ? '' : am>planMin*1.15 ? 'over' : am<planMin*0.85 ? 'under' : 'ok';
  return `<small class="act ${cls}">⏱ ${Math.round(am)} min${planMin?` (${diff>0?'+':''}${diff})`:''}</small>`; }
const prioOf = (i,w) => i.prio?.[w-1] || 'M';
const isKann = (sess,i) => prioOf(i,sess.w)==='K';
function groupBudget(sess, g){ const B=sess.T.blocks; if(!B) return null; let m=0, any=false; B.forEach(b=>{ if(grpOf({section:b.section||b.label, device:null})===g){ m+=Number(b.min[sess.w-1])||0; any=true; } }); return any?m:null; }
function turnPlanMin(sess){ const t=sess.T.time?.muss?.[sess.w-1]; return (typeof t==='number' && t>0) ? t : groupStats(sess,sess.items).min+30; }
function groupStats(sess, items){
  let tot=0, done=0, fin=0, cnt=0;
  items.forEach(i=>{ if(i.program || i.extra || isKann(sess,i)) return; const goal=goalOf(sess.day,i,sess.w); if(goal<=0) return; const e=S.turn[sess.date]?.items[ikey(i)]; const d=Math.min(goal,e?.done||0);
    tot+=goal*i.sec; done+=d*i.sec; cnt++; if(d>=goal) fin++; });
  return {min:tot/60, doneMin:done/60, remMin:(tot-done)/60, pct: tot?done/tot:(cnt?fin/cnt:0), fin, cnt};
}
function sessGroups(sess){
  const order=[]; const map={};
  sess.items.forEach(i=>{ const g=grpOf(i); if(!map[g]){ map[g]=[]; order.push(g); } map[g].push(i); });
  return order.map(g=>{ const st=groupStats(sess,map[g]); const bud=groupBudget(sess,g); if(bud!=null) st.min=bud; st.kann=map[g].filter(i=>!i.program && isKann(sess,i) && goalOf(sess.day,i,sess.w)>0).length; st.extra=map[g].filter(i=>i.extra).length; return {g, items:map[g], st}; }).filter(x=>x.st.cnt>0 || x.st.kann>0 || x.st.extra>0 || x.items.some(i=>i.program));
}
function gymProgress(g){
  const L=S.gym[g.id]; let tot=0, fin=0;
  g.items.forEach(it=>{ const n=setsOf(g,it); tot+=n; fin+=Math.min(n,(L?.items?.[it.nr]?.sets||[]).filter(s=>s.done).length); });
  return {tot, fin, pct: tot?fin/tot:0};
}
function hsExercise(name){ const n = name.toLowerCase(); return PLAN.handstand.exercises.find(x=>{ const k=x.name.split(/[(:]/)[0].trim().toLowerCase(); return n.startsWith(k); }); }
function itemDone(sess, i){ const g=goalOf(sess.day,i,sess.w); const e=S.turn[sess.date]?.items[ikey(i)]; return g>0 && (e?.done||0)>=g; }

/* ---------- charts ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function weekBars(data, opt){
  const W=340, H=150, L=34, R=6, T=10, B=22; const iw=W-L-R, ih=H-T-B;
  const max=niceMax(Math.max(1,...data.map(d=>Math.max(d.plan,d.done)))); const bw=iw/data.length; const cw=Math.min(16,bw-6);
  const y=v=>T+ih-(v/max)*ih; const cur=clampWeek(weekOf(today()));
  let g=''; [0,.5,1].forEach(f=>{ const v=max*f; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  data.forEach((d,k)=>{ const x=L+k*bw+(bw-cw)/2; const r=Math.min(4,cw/2);
    const bar=(v,cls)=>{ if(v<=0) return ''; const h=y(0)-y(v); const rr=Math.min(r,h); return `<path class="${cls}" d="M${x},${y(0)} V${y(v)+rr} q0,-${rr} ${rr},-${rr} h${cw-2*rr} q${rr},0 ${rr},${rr} V${y(0)} Z"/>`; };
    g+=bar(d.plan,'plan')+bar(d.done,'done');
    g+=`<text x="${x+cw/2}" y="${H-6}" text-anchor="middle" class="${d.w===cur?'cur':''}">${d.w}</text>`;
    g+=`<rect class="hit" x="${L+k*bw}" y="${T}" width="${bw}" height="${ih}" data-tip="Wo ${d.w}: ${fmt(Math.round(d.done*10)/10)} von ${fmt(Math.round(d.plan*10)/10)} ${opt.unit}" data-act="selweek" data-v="${d.w}"/>`; });
  g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${g}</svg>`;
}
function lineChart(series, opt){
  const W=opt.w||340, H=opt.h||160, L=36, R=10, T=14, B=22; const iw=W-L-R, ih=H-T-B;
  const ys=[...series.flatMap(s=>s.pts.map(p=>p.y)), ...(opt.step||[]).map(s=>s.y)]; if(!ys.length) return '';
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(opt.y0==null||opt.y1==null){ if(hi-lo<2){ hi+=2; lo-=2; } const pd=(hi-lo)*0.15; lo-=pd; hi+=pd; }
  if(opt.y0!=null) lo=opt.y0; if(opt.y1!=null) hi=opt.y1;
  const x=v=>L+(v-1)/14*iw, y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  let g=''; const ticks=opt.yticks || [lo+(hi-lo)*0.15, (lo+hi)/2, hi-(hi-lo)*0.15].map(v=>Math.round(v));
  ticks.forEach(v=>{ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  [1,5,9,13].forEach(w=>{ g+=`<text x="${x(w+0.5)}" y="${H-6}" text-anchor="middle">Wo ${w}</text>`; });
  g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  (opt.step||[]).forEach(s=>{ g+=`<line class="step" x1="${x(s.x0)}" x2="${x(s.x1)}" y1="${y(s.y)}" y2="${y(s.y)}"/><rect class="hit" x="${x(s.x0)}" y="${y(s.y)-8}" width="${x(s.x1)-x(s.x0)}" height="16" data-tip="Plan-Stand Wo ${s.x0}–${s.x1-1}: ${fmt(Math.round(s.y))} kg"/>`; });
  series.forEach(s=>{
    if(s.pts.length>1) g+=`<path class="ln" style="stroke:${s.color}" d="${s.pts.map((p,k)=>(k?'L':'M')+x(p.x).toFixed(1)+','+y(p.y).toFixed(1)).join(' ')}"/>`;
    s.pts.forEach((p,k)=>{ const last=k===s.pts.length-1; g+=`<circle cx="${x(p.x)}" cy="${y(p.y)}" r="${last?5:4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${x(p.x)}" cy="${y(p.y)}" r="14" data-tip="${esc(p.tip)}"/>`; });
    const lp=s.pts[s.pts.length-1]; if(lp && opt.endLabel){ const right=x(lp.x)>W-60; g+=`<text x="${right?x(lp.x)-8:x(lp.x)+8}" y="${y(lp.y)-8}" text-anchor="${right?'end':'start'}" class="cur">${fmt(Math.round(lp.y))}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'')}">${g}</svg>`;
}

function vTraining(){
  const d=UI.date, w=weekOf(d), dIso=iso(d);
  if(w<1||w>14) return `<div class="card"><h2>Außerhalb des Plans</h2><p class="muted">Der Plan läuft vom 19.10.2026 bis 24.01.2027.</p><div class="row" style="margin-top:10px"><button class="btn primary" data-act="date" data-v="2026-10-19">Zu Woche 1</button></div></div>`;
  const W=PLAN.weeks[w-1]; const units=unitsOf(d);
  let out=vIntro();
  const cp = checkpoints().find(c=>{ const diff=(parse(c.date)-d)/864e5; return diff>=0 && diff<=6; });
  const notes=[W.note?esc(W.note):'', cp?`<b>${dm(parse(cp.date))}</b> ${esc(cp.text)}`:''].filter(Boolean);
  const nkey = 'n'+[...notes.join('|')].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
  if(notes.length && !S.prefs.dismissed?.[nkey]) out += `<div class="dayinfo ${UI.open.dayinfo?'open':''}"><button type="button" class="dt" data-act="toggle" data-v="dayinfo"><span>ℹ</span><span class="t">${notes.join(' · ')}</span></button><button type="button" class="dx" data-act="dismiss" data-v="${nkey}" aria-label="Hinweis ausblenden">✕</button></div>`;
  out += vBackupNag();
  if(!units.length){
    out += `<h2>${WD[d.getDay()]}, ${dm(d)}</h2>`;
    const n=nextTraining(d);
    out += `<div class="card stack"><h2>Trainingsfrei</h2>${n?`<p class="muted">Nächstes Training: ${WD[n.d.getDay()]} ${dm(n.d)} · ${n.u.map(u=>u.label+' '+u.time).join(', ')}</p><div class="row"><button class="btn primary" data-act="date" data-v="${iso(n.d)}">Hinspringen</button></div>`:''}</div>`;
    return out + vFree(dIso);
  }
  if(!UI.unit || !units.some(u=>u.id===UI.unit)){
    const now=new Date(); let pick=units[units.length-1];
    if(dIso===iso(today())){ for(const u of units){ const [h,m]=u.time.split(':').map(Number); if(now.getHours()*60+now.getMinutes() < h*60+m+150){ pick=u; break; } } }
    else pick = units.find(u=>u.kind!=='swim')||units[0];
    UI.unit = pick.id;
  }
  if(units.length>1) out += `<div class="units" role="tablist">${units.map(u=>{ const dn = u.kind==='turn'? groupStats(u.t,u.t.items).pct>=1 : u.kind==='gym'? gymProgress(u.g).pct>=1 : u.kind==='home'? homeProgress(dIso).pct>=1 : !!S.swim[dIso]?.done;
    return `<button type="button" role="tab" class="unit ${UI.unit===u.id?'on':''}" data-act="unit" data-v="${u.id}">${u.label} · ${u.time}${dn?'<span class="dot"></span>':''}</button>`; }).join('')}</div>`;
  const u = units.find(x=>x.id===UI.unit);
  if(u.kind==='turn') out += vTurn(u.t, dIso);
  if(u.kind==='gym') out += vGym(u.g);
  if(u.kind==='swim') out += vSwim(dIso);
  if(u.kind==='home') out += vHome(dIso);
  return out + vFree(dIso);
}

const FORMQ = [['sleep','Schlaf'],['energy','Energie'],['body','Körper']];
const FORMHINT = {sleep:'1 kaum · 5 super', energy:'1 leer · 5 voll da', body:'1 Muskelkater · 5 frisch'};
const formScore = f => f? (f.sleep+f.energy+f.body)/3 : null;
function prevForm(key){ const f=S.form[key]; if(!f) return null; const others=Object.entries(S.form).filter(([k,v])=>k!==key && v.ts<f.ts).sort((a,b)=>b[1].ts-a[1].ts); return others[0]?.[1]||null; }

function vMenu(items){ return `<div class="menu">${items.map(m=>`<button type="button" data-act="${m.act}" data-v="${esc(m.v||'')}">${m.label}${m.sub?`<small>${m.sub}</small>`:''}</button>`).join('')}</div>`; }

function vTurn(sess, dIso){
  const T=sess.T, w=sess.w, D=S.turn[dIso]||{};
  const groups = sessGroups(sess); const all = groupStats(sess, sess.items);
  const planMin = turnPlanMin(sess);
  const endPlan = new Date(parse(dIso)); endPlan.setHours(19,0,0,0); endPlan.setMinutes(endPlan.getMinutes()+Math.round(planMin));
  const fkey='T-'+dIso;
  let live='';
  if(D.start && !D.end){ const rest=all.remMin+30*(1-all.pct); const fin=new Date(Date.now()+rest*60e3); live=`fertig ca. ${hm(fin)}`; }
  if(D.start && D.end) live=`${Math.round((D.end-D.start)/60e3)} min`;
  const twoInRow = turnSession(addDays(parse(dIso),-1)) || turnSession(addDays(parse(dIso),1));
  // aktuelles Gerät: zuletzt gewähltes, sonst das erste nicht fertige
  if(UI.devFor!==dIso || (UI.dev!=='Alle' && !groups.some(x=>x.g===UI.dev))){ const firstOpen=groups.find(x=>x.st.cnt>0 && x.st.fin<x.st.cnt) || groups[0]; UI.dev=firstOpen?firstOpen.g:null; UI.devFor=dIso; }
  const title = (T.title.split(' · ')[0]||'Turnen').toUpperCase();
  let html = `<div class="sesshead"><div class="ttl"><b>${esc(title)}</b><span>19–22 Uhr · ${all.fin}/${all.cnt} erledigt${live?' · '+live:''}</span></div>
    ${!D.start? (UI.formFor===fkey?'':`<button class="btn primary" data-act="formopen" data-v="${fkey}">▶ Start</button>`) : !D.end?`<button class="btn" data-act="tend">■ Ende</button>`:`<span class="small muted">beendet</span>`}
    <button class="icon-btn" data-act="menu" aria-label="Weitere Optionen">⋯</button></div>
    ${UI.formFor===fkey?`<div class="card">${vFormPanel(fkey,'tstart')}</div>`:''}
    ${UI.menu?`<div class="card stack"><p class="small muted">Plan ${Math.round(planMin)} min · Ende ca. ${hm(endPlan)} · ${all.fin}/${all.cnt} Übungen erledigt</p>
      <div class="compo" role="img" aria-label="Zeitanteile der Geräte">${groups.filter(x=>x.st.min>0).map(x=>`<span style="flex:${x.st.min.toFixed(2)};background:${dcol(x.g)}" data-tip="${DEV[x.g].label}: ${Math.round(x.st.min)} min"></span>`).join('')}</div>
      ${vMenu([
      {act:'showall', label: UI.showAll?'Nur geplante Übungen zeigen':'Alle Übungen der Geräte zeigen', sub:'auch Übungen mit Soll 0 in dieser Woche'},
      {act:'moveopen', v:sess.key, label:'Training verschieben', sub:'auf einen anderen Tag'},
      {act:'toggle', v:'hints', label: UI.open.hints?'Hinweise ausblenden':'Schwerpunkt, Hinweise und Regeln', sub:'warum der Abend so aufgebaut ist'},
      ...(D.start?[{act:'treset', label:'Zeitmessung zurücksetzen'}]:[]),
      ...(Object.keys(D.items||{}).length||D.start?[{act:'logdel', v:'turn:'+dIso, label:'Einträge dieses Abends löschen', sub:'alle Übungen, Zeiten und Start/Ende'}]:[])
    ])}
    ${UI.open.hints?`<div class="stack small"><p>${esc(T.focus.replace(/^Schwerpunkt:\s*/,''))}</p><p class="muted">${esc(T.why.replace(/^Warum:\s*/,''))}</p>${T.notes.map(n=>`<p class="muted">${esc(n)}</p>`).join('')}${ruleRef('Reihenfolge im Gerätblock')}${ruleRef('Check zu Beginn')}${ruleRef('Boden: immer vw')}${ruleRef('Pferd: immer')}${planMin>180?ruleRef('Turnabend > 180'):''}</div>`:''}</div>`:''}
    ${UI.move===sess.key?`<div class="card">${vMovePanel('turn',sess.key,sess.orig,dIso)}</div>`:''}`;
  if(UI.confirmDel==='turn:'+dIso) html += `<div class="note warn small row">Alle Einträge dieses Abends löschen? ${delBtn('turn:'+dIso)}</div>`;
  const fn = vFormNote(fkey,false); if(fn && fn.includes('warn')) html += fn;
  if(sess.date!==sess.orig) html += `<div class="note warn small">Verschoben von ${WD[parse(sess.orig).getDay()]} ${dm(parse(sess.orig))}.${twoInRow?' Zwei Turnabende hintereinander: am zweiten den Barren weglassen, falls er am ersten dran war.':''}</div>`;
  html += `<nav class="devnav" aria-label="Geräte">
    <button type="button" class="dchip all ${UI.dev==='Alle'?'on':''} ${all.cnt>0&&all.fin===all.cnt?'fin':''}" style="--dc:var(--accent)" data-act="dev" data-v="Alle"><span class="tx"><b>Alle</b><small>${all.fin}/${all.cnt}</small></span><span class="pb" style="width:${all.pct*100}%"></span></button>
    ${groups.map(x=>{ const fin=x.st.cnt>0&&x.st.fin===x.st.cnt; return `<button type="button" class="dchip ${UI.dev===x.g?'on':''} ${fin?'fin':''}" style="--dc:${dcol(x.g)}" data-act="dev" data-v="${x.g}"><span class="ic">${fin?'✓':devIcon(x.g)}</span><span class="tx"><b>${DEV[x.g].label}</b><small>${!x.st.cnt?esc(progLabel(x,sess)):`${x.st.fin}/${x.st.cnt}`}</small></span><span class="pb" style="width:${x.st.pct*100}%"></span></button>`; }).join('')}
  </nav>`;
  const onG = new Set(groups.map(y=>y.g));
  const pool = UI.showAll ? T.items.filter(i=>onG.has(grpOf(i)) && (!i.program || sess.items.includes(i))) : sess.items;
  const TT = turnTimes(dIso);
  const devBlock = x => {
  const all_ = pool.filter(i=>grpOf(i)===x.g);
  const kann = all_.filter(i=>!i.program && !i.extra && isKann(sess,i)); const xtra = all_.filter(i=>i.extra); const items = all_.filter(i=>!kann.includes(i) && !i.extra);
  const nowItem = items.find(i=>!i.program && goalOf(sess.day,i,w)>0 && !itemDone(sess,i)) || kann.find(i=>goalOf(sess.day,i,w)>0 && !itemDone(sess,i));
  let html = '';
  const ck='dc:'+dIso+':'+x.g; const finD = x.st.cnt>0 && x.st.fin===x.st.cnt; const coll = (UI.dcol||{})[ck] ?? (UI.dev==='Alle' && finD);
  html += `<button type="button" class="dhead tog ${coll?'coll':''} ${finD?'fin':''}" style="--dc:${dcol(x.g)}" data-act="dcol" data-v="${ck}" data-def="${coll?1:0}" aria-expanded="${!coll}"><span class="ic">${finD?'✓':devIcon(x.g)}</span><span class="t"><b>${DEV[x.g].label}</b>${coll&&x.st.cnt&&!finD?`<small>${x.st.cnt-x.st.fin} offen</small>`:''}</span><span class="r">${x.st.cnt?`<b>${x.st.fin}/${x.st.cnt}</b>${x.st.min>=1?' · '+Math.round(x.st.min)+' min':''}`:esc(progLabel(x,sess))}${devTimeTag(x.st.min, devActual(sess, x.g, TT))}</span><span class="chev">${coll?'▾':'▴'}</span></button>`;
  if(coll) return html;
  let sec=null; const multiSec = new Set(items.map(i=>i.section)).size>1;
  items.forEach(i=>{ if(multiSec && i.section!==sec){ sec=i.section; html+=`<div class="subsec">${esc(sec.replace(/^[^·]*·\s*/,'')||sec)}</div>`; } html += vTurnItem(i, sess, dIso, i===nowItem); });
  const kannShow = kann.filter(i=>UI.showAll || goalOf(sess.day,i,w)>0);
  if(kannShow.length) html += `<div class="subsec kannh">Kann · nur wenn Zeit bleibt</div><div class="kannbox">${kannShow.map(i=>vTurnItem(i, sess, dIso, i===nowItem)).join('')}</div>`;
  if(xtra.length) html += `<div class="subsec xtrah">Zusatz · selbst hinzugefügt</div>${xtra.map(i=>vTurnItem(i, sess, dIso, false)).join('')}`;
  html += (UI.xDraft && UI.xDraft.scope==='turn' && UI.xDraft.key===dIso && UI.xDraft.dev===x.g) ? vExtraForm() : `<button class="btn ghost addx" data-act="xopen" data-k="turn" data-v="${esc(x.g)}">＋ Zusatzübung ${esc(DEV[x.g]?.label||'')}</button>${xQuick('turn', dIso, x.g)}`;
  return html; };
  const finTurn = () => finishPanel('turn', dIso, planMin, D, Object.keys(D.items||{}).length>0, ()=>turnRecap(sess,dIso));
  if(UI.dev==='Alle'){ groups.forEach(x=>{ html += `<section class="devsec" id="dev-${x.g}">${devBlock(x)}</section>`; }); return html + finTurn(); }
  const x = groups.find(y=>y.g===UI.dev); if(!x) return html;
  html += devBlock(x);
  const k=groups.findIndex(y=>y.g===UI.dev); const prev=groups[k-1], next=groups[k+1];
  html += `<div class="devpager">${prev?`<button class="btn" style="--dc:${dcol(prev.g)}" data-act="dev" data-v="${prev.g}">‹ <i></i>${DEV[prev.g].label}</button>`:'<span></span>'}${next?`<button class="btn primary" style="--dc:${dcol(next.g)}" data-act="dev" data-v="${next.g}"><i></i>Weiter: ${DEV[next.g].label} ›</button>`:`<span class="small muted" style="align-self:center;text-align:center">letztes Gerät</span>`}</div>`;
  html += finTurn();
  return html;
}

function finishPanel(kind, key, planMin, D, hasEntries, recap){
  const open = UI.finish===key;
  if(D.end) return `<details class="card recapcard" ${UI.recap===key?'open':''}><summary class="finrow done"><span>✓ Abgeschlossen · ${Math.round((D.end-D.start)/60e3)} min</span><span class="small">Rückblick</span></summary>${recap?recap():''}<div class="row"><button class="btn ghost sm" data-act="unfinish" data-k="${kind}" data-v="${esc(key)}">wieder öffnen</button></div></details>`;
  if(!open) return `<button class="btn big finbtn" data-act="finopen" data-v="${esc(key)}">✓ Training abgeschlossen</button>`;
  const dur = D.start ? Math.max(1,Math.round((Date.now()-D.start)/60e3)) : Math.round(planMin);
  return `<div class="card stack finpanel"><b>Training abschließen</b>
    <div class="row" style="flex-wrap:nowrap"><label class="lbl" for="finDur">Dauer</label><input type="number" inputmode="numeric" id="finDur" value="${Math.min(dur, 600)}" style="max-width:90px"><span class="muted small">min${D.start?'':' · Start wird auf die Planzeit gesetzt'}</span></div>
    <p class="small muted">Es zählt nur, was du eingetragen hast. Offene Übungen bleiben offen.</p>
    <div class="row"><button class="btn primary" data-act="${kind==='turn'?'tfinish':'gfinish'}" data-v="${esc(key)}">✓ Abschließen</button><button class="btn ghost" data-act="finopen" data-v="">Abbrechen</button></div></div>`;
}

const FDEV = ['Boden','Sprung','Reck','Pferd','Barren','Ringe','Handstand','Kondition'];

function freeDraftNew(dIso){ const u=unitsOf(parse(dIso)); return {id:null, date:dIso, kind: u.some(x=>x.kind==='turn')?'turn':u.some(x=>x.kind==='gym')?'gym':'turn', title:'', min:'', note:'', items:[{name:'', amt:'', unit:'Wdh', kg:'', dev:''}]}; }

      <div class="frq"><input type="number" inputmode="numeric" id="fr-a-${k}" data-fr="amt" data-k="${k}" value="${esc(r.amt)}" placeholder="Menge"><select id="fr-u-${k}" data-fr="unit" data-k="${k}" aria-label="Einheit">${FUNITS.map(x=>`<option ${r.unit===x?'selected':''}>${x}</option>`).join('')}</select>
      ${d.kind==='gym'?`<input type="number" inputmode="decimal" id="fr-k-${k}" data-fr="kg" data-k="${k}" value="${esc(r.kg)}" placeholder="kg">`:''}
      <button class="btn ghost sm" data-act="frdel" data-k="${k}" aria-label="Übung entfernen">✕</button></div></div>`).join('')}</div>

function vFreeCard(f){ const its=(f.items||[]).filter(r=>r.name);

/* ----- Zuhause (Beweglichkeit, ab Plan v5) ----- */
function homeToday(d){ const H=PLAN.home; if(!H || !H.items?.length) return false; const w=weekOf(d); if(w<1||w>14) return false; if(WD[d.getDay()]!==H.day) return false; return H.items.some(i=>(i.w[w-1]||0)>0); }
function homeItems(dIso){ const w=clampWeek(weekOf(parse(dIso))); return (PLAN.home?.items||[]).map((it,k)=>({it,k,goal:it.w[w-1]||0, plan: parseSets(it.sets?.[w-1]) || (it.w[w-1]?[it.w[w-1]]:null)})).filter(x=>x.goal>0); }
function homeProgress(dIso){ const H=S.home?.[dIso]||{}; let tot=0, dn=0, fin=0, cnt=0; homeItems(dIso).forEach(x=>{ const v=(H[x.k]?.vals||[]).reduce((a,b)=>a+(b||0),0); tot+=x.goal; dn+=Math.min(v,x.goal); cnt++; if(v>=x.goal) fin++; }); return {pct: tot?dn/tot:0, fin, cnt}; }
function vHome(dIso){ const H=PLAN.home; const E=(S.home ||= {})[dIso] || {}; const its=homeItems(dIso); const pr=homeProgress(dIso);
  let html = `<div class="sesshead"><div class="ttl"><b>ZUHAUSE</b><span>${esc(H.time||'')} · Beweglichkeit · ${pr.fin}/${pr.cnt} erledigt</span></div></div>`;
  if(H.info) html += `<p class="small muted">${esc(H.info)}</p>`;
  its.forEach(x=>{ const isSec=/Sek/.test(x.it.unit||''); const step=isSec?5:1; const vals=E[x.k]?.vals||[]; const plan=x.plan||[x.goal]; const n=Math.max(plan.length, vals.length);
    const done=vals.reduce((a,b)=>a+(b||0),0); const fin=done>=x.goal;
    html += `<div class="item open ${fin?'':''}" style="--dc:var(--d-sprung)"><div class="ihead"><div class="txt"><div class="iname">${esc(x.it.name)}</div><div class="isub">${fmt(x.goal)} ${esc(x.it.unit||'')}${x.it.sets?.[clampWeek(weekOf(parse(dIso)))-1]?' · '+esc(x.it.sets[clampWeek(weekOf(parse(dIso)))-1]):''}</div></div><div class="goal"><div class="n ${fin?'okc':''}">${fmt(done)}</div><div class="u">/ ${fmt(x.goal)}</div></div></div>
      <div class="sets">${[...Array(n)].map((_,r)=>{ const v=vals[r]||0; const soll=plan[r]; const ok=soll!=null?v>=soll:v>0;
        return `<div class="tset ${isSec&&soll!=null?'timed':''} ${ok?'ok':v>0?'part':''}"><span class="i">${r+1}</span><span class="soll">${soll!=null?'Soll '+soll+(isSec?' s':''):'extra'}</span><button class="pm" data-act="hadj" data-k="${x.k}" data-r="${r}" data-v="${-step}">−</button><b class="sv">${v}</b><button class="pm" data-act="hadj" data-k="${x.k}" data-r="${r}" data-v="${step}">+</button>${isSec&&soll!=null?`<button class="pm play" data-act="hold" data-src="home" data-k="${x.k}" data-r="${r}" aria-label="Satz ${r+1} mit Timer">▶</button>`:''}<button class="chk" data-act="hfull" data-k="${x.k}" data-r="${r}" data-v="${soll??plan[plan.length-1]}">✓</button></div>`; }).join('')}</div>${isSec?`<p class="small muted">▶ startet den Satz mit Timer, danach ${S.prefs.stretchPause||15} s Pause und der nächste Satz startet automatisch. „Fertig“ im Timer stoppt.</p>`:''}</div>`; });
  if(H.moved?.length) html += `<details class="card"><summary><b>Aus der Halle verlegt</b></summary><div class="flist" style="margin-top:6px">${H.moved.map(m=>`<div class="lgi"><span>${esc(m.name)}</span><span class="small muted">${esc(m.now||'')}</span></div>`).join('')}</div></details>`;
  return html; }

function vExtraForm(){ const d=UI.xDraft; const isGym=d.scope==='gym';
  const names = isGym ? [...new Set([...LIB.flatMap(gp=>gp.ex.map(e=>e[0])), ...(S.customEx||[]).map(c=>c.n)])] : exNames();

    <div class="seg full">${T.map(([k,l])=>`<button class="${d.type===k?'on':''}" data-act="xtype" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap">${d.type==='versuch'?'':`<div class="field"><label class="lbl" for="xSets">Sätze</label><input type="number" inputmode="numeric" id="xSets" data-xf="sets" value="${esc(d.sets)}"></div>`}

      ${isGym&&d.type==='kg'?`<div class="field"><label class="lbl" for="xKg">kg</label><input type="number" inputmode="decimal" id="xKg" data-xf="kg" value="${esc(d.kg)}"></div><div class="field"><label class="lbl" for="xRir">RIR</label><input type="number" inputmode="numeric" id="xRir" data-xf="rir" value="${esc(d.rir)}"></div>`:''}</div>
    <button class="chip ${d.week?'on':''}" data-act="xweek" style="align-self:flex-start">${d.week?'✓ ':''}Auch für die restlichen ${isGym?'Gym-':'Turn-'}Einheiten dieser Woche</button>
    <button class="btn primary" data-act="xsave">Hinzufügen</button>
    <p class="small muted">Die Übung erscheint danach wie eine geplante Übung und zählt in der Statistik über den Plan hinaus.</p></div>`; }
function progLabel(x, sess){

/* ----- Fortschritt-Daten ----- */
/* Ausführungen: Wdh, Versuche, Elemente, Sätze. Halteübungen in Sekunden zählen als Sätze. */
const isSecUnit = i => /Sek/.test(String(i.unit||''));
function execCount(i, n){ if(!n) return 0; if(isSecUnit(i)) return i.setSize ? Math.ceil(n/i.setSize) : 1; return n; }
function execDone(i, e){ if(!e) return 0; if(isSecUnit(i)){ if(e.inc) return e.inc.filter(v=>v>0).length; return i.setSize ? Math.ceil((e.done||0)/i.setSize) : ((e.done||0)>0?1:0); } return e.done||0; }
function turnSessMetrics(sess, dIso){ const D=S.turn[dIso]||{}; let plan=0, done=0, mc=0, mf=0, V=0, G=0; const gr=[];
  sess.items.forEach(i=>{ if(i.program) return; const goal=goalOf(sess.day,i,sess.w); const e=D.items?.[ikey(i)]; const kann=isKann(sess,i);
    if(!kann && !i.extra && goal>0){ plan+=execCount(i,goal); mc++; if((e?.done||0)>=goal) mf++; }
    done+=execDone(i,e);
    if(i.status==='Versuch' && e){ V+=e.done||0; G+=okCount(e)||0; (e.grades||[]).forEach(x=>{ if(x!=null) gr.push(x); }); if(!e.grades && e.note!=null) gr.push(e.note); } });
  return {plan, done, mc, mf, V, G, avg: gr.length? gr.reduce((a,x)=>a+x,0)/gr.length : null}; }
function turnWeekMetrics(w){ const m={plan:0, done:0, mc:0, mf:0, V:0, G:0, gsum:0, gn:0, dev:{}};
  turnSlots().filter(sl=>sl.w===w).forEach(sl=>{ const sess=turnSession(parse(sl.date)); if(!sess) return; const x=turnSessMetrics(sess, sl.date);
    m.plan+=x.plan; m.done+=x.done; m.mc+=x.mc; m.mf+=x.mf; m.V+=x.V; m.G+=x.G; if(x.avg!=null){ m.gsum+=x.avg; m.gn++; }
    const D=S.turn[sl.date]||{}; sess.items.forEach(i=>{ if(i.program) return; const g=grpOf(i); const o=(m.dev[g] ||= {plan:0, done:0}); const goal=goalOf(sess.day,i,sess.w); if(!isKann(sess,i) && !i.extra) o.plan+=execCount(i,goal); o.done+=execDone(i, D.items?.[ikey(i)]); }); });
  (S.free||[]).filter(f=>f.kind==='turn' && weekOf(parse(f.date))===w).forEach(f=>(f.items||[]).forEach(r=>{ m.done+=Number(r.amt)||0; }));
  m.avg = m.gn? m.gsum/m.gn : null; return m; }
/* Gym-Load: Summe kg × Wdh. Geplant = Ziel-kg × Sätze × mittlere Wdh (nur Übungen mit Zielgewicht) */
function gymLoadOf(g){ const L=S.gym[g.id]; let plan=0, done=0;
  g.items.forEach(it=>{ const tg=target(it); const rr=repsRange(it.reps); if(typeof tg==='number' && tg>0 && rr && !/\d\s*s$/.test(String(it.reps).trim())) plan+=tg*setsOf(g,it)*(rr.lo+rr.hi)/2; });
  gItems(g).forEach(it=>(L?.items?.[it.nr]?.sets||[]).forEach(x=>{ if(x.done && Number(x.kg)>0 && Number(x.reps)>0) done+=Number(x.kg)*Number(x.reps); }));
  return {plan, done}; }
function weekProgress(metric){
  const rows=[...Array(14)].map((_,k)=>({w:k+1, plan:0, done:0}));
  if(metric==='gym'){
    PLAN.gym.forEach(g=>{ const w=parseInt(g.code.slice(1)); const l=gymLoadOf(g); rows[w-1].plan+=l.plan/1000; rows[w-1].done+=l.done/1000; });
    rows.forEach(r=>{ r.plan=Math.round(r.plan*10)/10; r.done=Math.round(r.done*10)/10; });
    return rows;
  }
  turnSlots().forEach(sl=>{ const T=PLAN.turnen[sl.day];
    T.items.forEach(i=>{ if(i.program || (i.prio?.[sl.w-1]==='K')) return; const goal=goalOf(sl.day,i,sl.w); if(goal<=0) return;
      const hand = metric==='hand'; if(hand && !(grpOf(i)==='Handstand')) return;
      const e=S.turn[sl.date]?.items[ikey(i)]; const d=Math.min(goal,e?.done||0);
      if(hand){ rows[sl.w-1].plan+=goal; rows[sl.w-1].done+=d; } }); });
  if(metric!=='hand') rows.forEach(r=>{ const m=turnWeekMetrics(r.w); r.plan=m.plan; r.done=m.done; r.m=m; });
  return rows;
}
function e1Series(c){
  const pts=[];
  PLAN.gym.slice().sort((a,b)=>gDate(a).localeCompare(gDate(b))).forEach(g=>{ let best=null;
    g.items.forEach(it=>{ if(!exKey(it.name).startsWith(c.name) || isSwapped(g,it)) return; (S.gym[g.id]?.items?.[it.nr]?.sets||[]).forEach(s=>{ if(!s.done||s.kg===''||!s.reps||s.rir===''||s.rir==null) return; const v=e1({nr:c.nr,kg:Number(s.kg),reps:Number(s.reps),rir:Number(s.rir)}); if(!best||v>best.v) best={v,s}; }); });
    if(best) pts.push({x:weekX(gDate(g)), y:best.v, date:gDate(g), s:best.s, tip:`${dm(parse(gDate(g)))}: ${fmt(Number(best.s.kg))} kg × ${best.s.reps} @ RIR ${best.s.rir} → e1RM ${fmt(Math.round(best.v))}`}); });
  return pts;
}
function e1Step(c){ const out=[]; PLAN.ltStates.forEach((st,k)=>{ if(!st) return; const v=e1rm(c.nr,st); if(v==null) return; const last=out[out.length-1]; if(last && Math.abs(last.y-v)<0.01 && last.x1===k+1) last.x1=k+2; else out.push({x0:k+1,x1:k+2,y:v}); }); return out; }

/* ----- Statistik › Übungen: Liste wie im Log, antippen öffnet Verlauf ----- */
function spark(vals, opt={}){ const v=vals.filter(x=>x!=null); if(!v.length) return '<span class="spk"></span>'; const W=74,H=24,P=3;
  const lo=Math.min(...v), hi=Math.max(...v); const span=hi-lo||1; const n=vals.length; const X=i=>P+(n<=1?(W-2*P)/2:i*(W-2*P)/(n-1)), Y=x=>H-P-(x-lo)/span*(H-2*P)*(hi===lo?0:1)-(hi===lo?(H-2*P)/2:0);
  const pts=vals.map((x,i)=>x==null?null:[X(i),Y(x)]).filter(Boolean);
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(c=>c.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${opt.c||'var(--accent)'}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.6" fill="${opt.c||'var(--accent)'}"/></svg>`; }
function sparkBars(rows){ const r=rows.slice(-10); if(!r.length) return '<span class="spk"></span>'; const W=74,H=24; const max=Math.max(1,...r.map(x=>Math.max(x.plan||0,x.done||0))); const bw=Math.min(9,(W-2)/r.length-2);

    return `<rect x="${X}" y="${H-hp}" width="${bw}" height="${hp}" rx="1.5" fill="var(--sunk)"/><rect x="${X}" y="${H-hd}" width="${bw}" height="${hd}" rx="1.5" fill="${x.ok!=null&&x.done?'var(--ok)':'var(--accent)'}"/>`; }).join('')}</svg>`; }
function trendTag(a,b,unit=''){ if(a==null||b==null) return ''; const d=b-a; const r=Math.abs(d)<0.5?'→':d>0?'↑':'↓'; const c=r==='↑'?'var(--ok)':r==='↓'?'var(--warn)':'var(--muted)'; return `<span class="trd" style="color:${c}">${r}${r==='→'?'':` ${d>0?'+':''}${fmt(Math.round(d*10)/10)}${unit}`}</span>`; }

function planDiff(A, B){ const out={turn:[], gym:[], weeks:[], home:[]};
  ['Mo','Di','Do'].forEach(d=>{ const an=new Map((A.turnen[d]?.items||[]).map(i=>[i.name,i])), bn=new Map((B.turnen[d]?.items||[]).map(i=>[i.name,i]));
    bn.forEach((i,n)=>{ if(!an.has(n)) out.turn.push({t:'neu', d, n}); else { const o=an.get(n); const ch=i.w.map((v,k)=>v!==o.w[k]?`Wo ${k+1}: ${o.w[k]}→${v}`:null).filter(Boolean); if(ch.length) out.turn.push({t:'menge', d, n, x:ch}); const pc=(i.prio||[]).join('')!==(o.prio||[]).join(''); if(pc && i.prio) out.turn.push({t:'prio', d, n}); } });
    an.forEach((i,n)=>{ if(!bn.has(n)) out.turn.push({t:'weg', d, n}); }); });
  const gk=P=>new Set(P.gym.flatMap(g=>g.items.map(it=>exKey(it.name)))); const ga=gk(A), gb=gk(B);
  gb.forEach(n=>{ if(!ga.has(n)) out.gym.push({t:'neu', n}); }); ga.forEach(n=>{ if(!gb.has(n)) out.gym.push({t:'weg', n}); });
  B.weeks.forEach((w,k)=>{ const o=A.weeks[k]; if(!o) return; if((w.note||'')!==(o.note||'') || w.phase!==o.phase) out.weeks.push({w:k+1, phase:w.phase, note:w.note}); });
  if(!!B.home !== !!A.home) out.home.push(B.home?'neu: Zuhause-Einheit':'Zuhause-Einheit entfällt');
  return out; }
