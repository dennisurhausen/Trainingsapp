      if(Number(v)<0){ const I=gI(g.id,it.nr); I.sets=(I.sets||[]).slice(0,n); } save(); msg = Number(v)>0 ? `Satz ${n} hinzugefügt` : `Satz entfernt`; break; }
    case 'setsreset': delete S.ovr.sets[b.dataset.key]; save(); break;
    case 'gtoggle': { const I=gI(b.dataset.g,b.dataset.nr); I.sets[0]={...(I.sets[0]||{}), done:!I.sets[0]?.done}; const L=gL(b.dataset.g); if(!L.start && gDate(PLAN.gym.find(x=>x.id===b.dataset.g))===iso(today())) L.start=Date.now(); save(); break; }
    case 'gset': {
      const g=PLAN.gym.find(x=>x.id===b.dataset.g); const it=g.items.find(i=>i.nr==b.dataset.nr); const k=Number(b.dataset.k); const I=gI(g.id,it.nr);
      const s=I.sets[k] ||= {}; readSetInputs(g.id,it.nr,k,s);
      if(s.done){ s.done=false; msg='Satz wieder offen'; }
      else {
        const tg=target(it); const rr=repsRange(it.reps); const prevSet=I.sets[k-1];
        if(s.kg===''||s.kg==null) s.kg = prevSet?.kg!==''&&prevSet?.kg!=null? prevSet.kg : (typeof tg==='number'?tg:'');
        if(s.reps===''||s.reps==null) s.reps = prevSet?.reps || (rr?rr.lo:'');
        if(s.rir===''||s.rir==null){ const m=String(it.rir).match(/\d+/); s.rir = m?Number(m[0]):''; }
        s.done=true;
        const L=gL(g.id); if(!L.start && gDate(g)===iso(today())) L.start=Date.now();
        const last = I.sets.filter(x=>x.done).length>=setsOf(g,it) && it === g.items[g.items.length-1];
        const p=pauseSec(it.pause); if(p && !last) startTimer(p, exKey(I.alt&&it.alt?it.alt:it.name));
        msg=`Satz ${k+1}: ${fmt(Number(s.kg))} kg × ${s.reps}`;
      }
      save(); break; }
    case 'ls': S.lernstufe[b.dataset.name]=v; save(); break;
    case 'takebest': { const c=PLAN.calc.find(x=>x.nr==b.dataset.nr); const best=bestFromLog(c); if(best){ (S.calc[c.nr] ||= {})[b.dataset.st]={kg:best.kg,reps:best.reps,rir:best.rir}; save(); msg=`Stand ${b.dataset.st} gesetzt: ${fmt(Math.round(best.v))} kg`; } break; }
    case 'metric': UI.metric=v; UI.selWeek=null; break;
    case 'stattab': UI.statTab=v; break;
    case 'selweek': UI.selWeek=Number(v); break;
    case 'cmpweek': { const cw=UI.cmpWeek||clampWeek(weekOf(today())); UI.cmpWeek=Math.max(1,Math.min(14,cw+Number(v))); break; }
    case 'addnote': { const text=$('#nText').value.trim(); if(!text){ toast('Bitte zuerst eine Notiz schreiben.'); return; } S.notes.push({id:uid(), date:$('#nDate').value, topic:$('#nTopic').value.trim(), text, pain:$('#nPain').value}); save(); msg='Notiz gespeichert'; break; }
    case 'delnote': S.notes=S.notes.filter(n=>n.id!==v); save(); break;
    case 'xlsx': exportExcel(); return;
    case 'export': S.prefs.lastBackup=Date.now(); save(); setTimeout(render,50); saveFile(`trainingsplan-backup-${iso(today())}.json`, new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); return;
    case 'copy': S.prefs.lastBackup=Date.now(); save(); copyText(JSON.stringify(S)); return;
    case 'importtext': doImport($('#impText').value); break;
    case 'reset1': UI.confirmReset=true; break;
    case 'reset0': UI.confirmReset=false; break;
    case 'reset2': S=seed(blank()); save(); UI.confirmReset=false; msg='Zurückgesetzt'; break;
    default: return;
  }
  if(S.prefs.auto!==false && tk && wasDone===false && okeyDone(tk)===true && UI.open[tk]){ UI.open[tk]=false; const nx=nextOpenKey(tk); if(nx){ UI.open[nx]=true; UI.scrollTo=nx; } }
  render();
  if(UI.scrollTo){ const key=UI.scrollTo; UI.scrollTo=null; setTimeout(()=>{ const el=[...document.querySelectorAll('.ihead[data-v]')].find(x=>x.dataset.v===key)?.closest('.item'); if(el){ const y=el.getBoundingClientRect().top+scrollY-($('#topwrap').offsetHeight+70); scrollTo({top:Math.max(0,y), behavior:'smooth'}); } }, 30); }
  if(msg){ undoSnap = snap; toast(msg, !!snap); }
});
function readSetInputs(gid,nr,k,s){ ['kg','reps','rir'].forEach(f=>{ const el=document.getElementById(`g-${gid}-${nr}-${k}-${f}`); if(el && el.value!=='') s[f]=Number(el.value); }); }

document.addEventListener('change', ev=>{
  const el=ev.target; const f=el.dataset.in;
  if(el.id==='impFile'){ const file=el.files[0]; if(file){ const r=new FileReader(); r.onload=()=>{ doImport(r.result); render(); }; r.readAsText(file); } return; }
  if(!f) return; syncIn(); const dIso=iso(UI.date);
  if(f==='tnotiz'){ const e=tEntry(dIso,el.dataset.ik,true); e.notiz=el.value; }
  if(f==='statex'){ UI.statEx=el.value; render(); return; }
  if(f==='hilfe'){ const e=tEntry(dIso,el.dataset.ik,true); e.hilfe=el.value; if(el.value) S.lastHilfe[el.dataset.name]=el.value; save(); render(); return; }
  if(f==='swim'){ (S.swim[dIso] ||= {}).note=el.value; }
  if(f==='gset'){ const I=gI(el.dataset.g,el.dataset.nr); const s=I.sets[Number(el.dataset.k)] ||= {}; s[el.dataset.f]= el.value===''?'':Number(el.value); }
  if(f==='gnote'){ gI(el.dataset.g,el.dataset.nr).note=el.value; }
  if(f==='gpain'){ const v=el.value===''?'':Math.max(0,Math.min(10,Number(el.value))); gI(el.dataset.g,el.dataset.nr).pain=v; save(); render(); return; }
  if(f==='calc'){ const nr=el.dataset.nr, st=el.dataset.st; const base=calcTest(Number(nr),st)||{}; const o=(S.calc[nr] ||= {})[st] = {kg:base.kg??'',reps:base.reps??'',rir:base.rir??''}; o[el.dataset.f]= el.value===''?'':Number(el.value); if(o.kg===''&&o.reps==='') delete S.calc[nr][st]; save(); render(); return; }
  if(f==='bw'){ const v=Number(el.value); if(v>0){ PLAN.bodyweight=v; S.bodyweight=v; save(); render(); } return; }
  save();
});

const tip=$('#tip');
function showTip(t, x, y){ tip.textContent=t; tip.hidden=false; const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px'; tip.style.top=Math.max(8,y-h-12)+'px'; }
document.addEventListener('pointermove', e=>{ if(e.pointerType!=='mouse') return; const t=e.target.closest?.('[data-tip]'); if(t) showTip(t.dataset.tip, e.clientX, e.clientY); else tip.hidden=true; });
document.addEventListener('pointerdown', e=>{ const t=e.target.closest?.('[data-tip]'); if(t && e.pointerType!=='mouse'){ showTip(t.dataset.tip, e.clientX, e.clientY); clearTimeout(showTip._t); showTip._t=setTimeout(()=>tip.hidden=true,2500); } else if(!t) tip.hidden=true; });
window.addEventListener('scroll', ()=>{ tip.hidden=true; }, {passive:true});

function copyText(text){
  const out=$('#outText');
  const fallback=()=>{ if(out){ out.hidden=false; out.value=text; out.focus(); out.select(); toast('Text markiert – bitte kopieren'); } };
  try{ navigator.clipboard.writeText(text).then(()=>toast('In die Zwischenablage kopiert'), fallback); }catch(e){ fallback(); }
}
function doImport(text){
  try{ const s=JSON.parse(text); if(!s || typeof s!=='object' || !('turn' in s) || !('gym' in s)) throw new Error('format'); S=migrate(s); if(S.bodyweight) PLAN.bodyweight=S.bodyweight; save(); toast('Backup eingespielt'); }
  catch(e){ toast('Das ist kein gültiges Backup dieser App.'); }
}

let TM=null;
/* ---- Ton, Display an, Benachrichtigung ---- */
let AC=null, AQ=[], WL=null, SWR=null;
function audioUnlock(){ try{ AC ||= new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beepAt(t0){ const nodes=[]; try{ [0,.22,.44, 1.1,1.32,1.54].forEach((d,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value = i%3===2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.18); o.connect(g); g.connect(AC.destination); o.start(t0+d); o.stop(t0+d+0.2); nodes.push(o); }); }catch(e){} return nodes; }
function beepNow(){ if(!S.prefs.sound) return; audioUnlock(); if(AC) beepAt(AC.currentTime+0.05); }
function cancelBeep(){ AQ.forEach(o=>{ try{ o.stop(); }catch(e){} }); AQ=[]; }
function scheduleBeep(){ cancelBeep(); if(!S.prefs.sound || !TM) return; audioUnlock(); if(!AC) return; const dt=(TM.end-Date.now())/1000; if(dt>0) AQ=beepAt(AC.currentTime+dt); }
let WLp=false;
async function wakeOn(){ if(!S.prefs.wake || !('wakeLock' in navigator) || WL || WLp || document.visibilityState!=='visible') return; WLp=true; try{ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release',()=>{ WL=null; }); }catch(e){} WLp=false; }
function wakeOff(){ try{ WL?.release(); }catch(e){} WL=null; }
function sessionRunning(){ const t=iso(today()); const D=S.turn[t]; if(D?.start && !D.end) return true; return PLAN.gym.some(g=>gDate(g)===t && S.gym[g.id]?.start && !S.gym[g.id]?.end); }
function wakeSync(){ if(TM || sessionRunning()) wakeOn(); else wakeOff(); }
function swPost(msg){ try{ const c = navigator.serviceWorker?.controller || SWR?.active; c?.postMessage(msg); }catch(e){} }
function notifyAsk(){ try{ if(S.prefs.notify && 'Notification' in window && Notification.permission==='default' && !S.prefs.asked){ S.prefs.asked=true; save(); Notification.requestPermission().then(()=>render()); } }catch(e){} }
function notifySchedule(){ if(!TM || !S.prefs.notify) return; try{ if(!('Notification' in window) || Notification.permission!=='granted') return; }catch(e){ return; }
  swPost({type:'pause', delay:TM.end-Date.now(), title:'Pause vorbei', body:'Nächster Satz: '+TM.label}); }
function startTimer(sec,label){ stopTimer(); TM={end:Date.now()+sec*1000,label}; $('#timer').hidden=false; audioUnlock(); scheduleBeep(); notifyAsk(); notifySchedule(); wakeOn(); tick(); TM.iv=setInterval(tick,250); }
function stopTimer(){ if(TM){ clearInterval(TM.iv); TM=null; } cancelBeep(); swPost({type:'cancel'}); $('#timer').hidden=true; $('#timer').classList.remove('over'); wakeSync(); }
function tick(){ if(!TM) return; const left=Math.round((TM.end-Date.now())/1000); const a=Math.abs(left);
  $('#timerT').textContent=(left<0?'+':'')+Math.floor(a/60)+':'+pad(a%60);
  $('#timerL').textContent = left>0 ? 'Pause · '+TM.label : 'Pause vorbei · nächster Satz';
  if(left<=0 && !TM.buzzed){ TM.buzzed=true; $('#timer').classList.add('over'); try{ navigator.vibrate&&navigator.vibrate([300,120,300,120,300]); }catch(e){}
    if(!AQ.length || Date.now()-TM.end > 1500 || (AC && AC.state!=='running')) beepNow(); AQ=[]; }
}
$('#timerPlus').addEventListener('click',()=>{ if(TM){ if(TM.buzzed && TM.end<Date.now()) TM.end=Date.now(); TM.end+=30000; TM.buzzed=false; $('#timer').classList.remove('over'); scheduleBeep(); notifySchedule(); tick(); } });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ if(AC && AC.state==='suspended') AC.resume(); tick(); wakeSync(); } });
try{ if('serviceWorker' in navigator && window.isSecureContext && window.top===window) navigator.serviceWorker.register('sw.js').then(r=>{ SWR=r; }).catch(()=>{}); }catch(e){}
$('#timerStop').addEventListener('click',stopTimer);

setInterval(()=>{ if(UI.tab==='training' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){ const d=S.turn[iso(UI.date)]; if(d?.start && !d.end) render(); } }, 60000);
window.addEventListener('resize', ()=>{ document.documentElement.style.setProperty('--toph', $('#topwrap').offsetHeight+'px'); });

if(S.bodyweight) PLAN.bodyweight=S.bodyweight;
save();
restoreUI(); applyTheme(); render();
try{ navigator.storage?.persisted?.().then(p=>{ if(!p) navigator.storage.persist?.(); }); }catch(e){}
/* Wischen: unten = Gerät wechseln, Wochenleiste = Tag wechseln */
let SW0=null;
document.addEventListener('touchstart', e=>{ if(e.touches.length!==1){ SW0=null; return; } const t=e.target;
  if(t.closest('input,textarea,select,.devnav,.tablewrap,svg,.adjbar,.timer,.seq,.compo')){ SW0=null; return; }
  SW0={x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(), top:!!t.closest('#topwrap')}; }, {passive:true});
document.addEventListener('touchend', e=>{ if(!SW0) return; const p=e.changedTouches[0]; const dx=p.clientX-SW0.x, dy=p.clientY-SW0.y; const s0=SW0; SW0=null;
  if(UI.tab!=='training' || Date.now()-s0.t>700 || Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6) return;
  const dir = dx<0 ? 1 : -1; const v=$('#view');
  if(s0.top){ UI.date=addDays(UI.date, dir); UI.unit=null; UI.menu=false; render(); v.classList.remove('swl','swr'); void v.offsetWidth; v.classList.add(dir>0?'swl':'swr'); return; }
  if(UI.dev && UI.dev!=='Alle'){ const chips=[...document.querySelectorAll('.dchip:not(.all)')]; const k=chips.findIndex(c=>c.classList.contains('on')); const nx=chips[k+dir]; if(nx){ nx.click(); v.classList.remove('swl','swr'); void v.offsetWidth; v.classList.add(dir>0?'swl':'swr'); } } }, {passive:true});
</script>
